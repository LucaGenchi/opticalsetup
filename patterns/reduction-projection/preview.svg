<title>Fourfold reduction exposure — OpticalSetup setup</title><desc>A real 200/50 mm relay projects a native object with quarter-scale ideal magnification onto the camera. The long first focal length and shorter second focal length create the reduction. Native 2D geometrical rays are computed. Diffraction, target-image irradiance and real-lens aberrations are not calculated; ideal object-image markers are separate paraxial constructions. This is the projection subsystem; no digital spatial modulator or calibrated image brightness is simulated.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="31.4" y="138" width="622.6" height="140" fill="#ffffff"/><polyline points="81.00,200.00 280.00,213.92 530.00,214.00 580.00,200.02" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="81.00,200.00 280.00,209.27 530.00,209.33 580.00,200.01" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="81.00,200.00 280.00,204.63 530.00,204.66 580.00,200.01" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="81.00,200.00 280.00,200.00 530.00,200.00 580.00,200.00" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="81.00,200.00 280.00,195.37 530.00,195.34 580.00,199.99" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="81.00,200.00 280.00,190.73 530.00,190.67 580.00,199.99" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="81.00,200.00 280.00,186.08 530.00,186.00 580.00,199.98" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="579.85,198.75 579.85,201.25" fill="none" stroke="#65ff00" stroke-width="2.2" opacity="0.85" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/><polyline points="579.85,201.25 581.05,201.25" fill="none" stroke="#65ff00" stroke-width="2.2" opacity="0.85" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/><polyline points="579.85,200.13 580.75,200.13" fill="none" stroke="#65ff00" stroke-width="2.2" opacity="0.85" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/><g transform="translate(80 200) rotate(0)"><line x1="-7" y1="0" x2="7" y2="0" stroke="#888" stroke-width="1.2"/><polyline points="-0.6,5.0 -0.6,-5.0" fill="none" stroke="#65ff00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="-0.6,-5.0 4.2,-5.0" fill="none" stroke="#65ff00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="-0.6,-0.5 3.0,-0.5" fill="none" stroke="#65ff00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="80.0" y="228.0" text-anchor="middle"  font-size="11" fill="#444">object</text><g transform="translate(280 200) rotate(0)"><path d="M 0,-25 Q 9,0 0,25 Q -9,0 0,-25 Z" fill="#c9e4f5" stroke="#4a90c4" stroke-width="1.5"/></g><text x="280.0" y="241.0" text-anchor="middle"  font-size="11" fill="#444">first</text><g transform="translate(530 200) rotate(0)"><path d="M 0,-25 Q 9,0 0,25 Q -9,0 0,-25 Z" fill="#c9e4f5" stroke="#4a90c4" stroke-width="1.5"/></g><text x="530.0" y="241.0" text-anchor="middle"  font-size="11" fill="#444">second</text><g transform="translate(602 200) rotate(0)"><rect x="-20" y="-30" width="40" height="60" rx="3" fill="#4b5563" stroke="#2b333d" stroke-widt