<title>Native opposite-orientation dispersion prisms — OpticalSetup setup</title><desc>A visible native continuum passes two N-BK7 prisms in opposite orientations. Their refracted wavelength-dependent paths can be inspected at a downstream camera while prism position and angle are edited. This is a physical 2D dispersive-prism pair. It does not model atmospheric refraction, counter-rotation about a 3D optical axis or automatically compensate a chosen zenith distance.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="18" y="108" width="734" height="184" fill="#ffffff"/><polyline points="152.00,200.00 293.30,200.00" fill="none" stroke="#7c3aed" stroke-width="5" opacity="0.24" stroke-linejoin="round" stroke-linecap="round" /><polyline points="152.00,200.00 293.30,200.00" fill="none" stroke="#f97316" stroke-width="3.2" opacity="0.28" stroke-linejoin="round" stroke-linecap="round" /><polyline points="152.00,200.00 293.30,200.00" fill="none" stroke="#dbe7f5" stroke-width="1.8" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="293.30,200.00 307.03,201.24 437.18,239.48 442.69,239.97 678.00,239.97" fill="none" stroke="#a10000" stroke-width="2" opacity="0.38458880599999995" stroke-linejoin="round" stroke-linecap="round" /><polyline points="293.30,200.00 307.03,201.24 437.20,239.56 442.67,240.05 678.00,240.05" fill="none" stroke="#e80000" stroke-width="2" opacity="0.4191776119999999" stroke-linejoin="round" stroke-linecap="round" /><polyline points="293.30,200.00 307.03,201.24 437.23,239.65 442.64,240.14 678.00,240.14" fill="none" stroke="#ff0000" stroke-width="2" opacity="0.4191776119999999" stroke-linejoin="round" stroke-linecap="round" /><polyl