<title>Folded two-mirror image relay — OpticalSetup setup</title><desc>An actual two-conic Gregorian reflective relay carries a collimated 266 nm input through two reflections to a camera behind the perforated primary. Adapted from the native Gregorian example. Exact conic intersections and reflected 2D rays are computed. No UV coating spectrum, diffraction or calibrated ultraviolet throughput is calculated.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="68" y="117" width="521.3" height="162" fill="#ffffff"/><polygon points="202.00,163.00 495.44,163.00 496.17,165.25 202.00,165.25" fill="#8b00d4" opacity="0.28"/><polygon points="495.44,163.00 442.82,203.09 442.38,202.06 496.17,165.25" fill="#8b00d4" opacity="0.26880000000000004"/><polygon points="442.82,203.09 512.50,190.00 512.50,190.00 442.38,202.06" fill="#8b00d4" opacity="0.258048"/><polygon points="202.00,165.25 496.17,165.25 496.84,167.50 202.00,167.50" fill="#8b00d4" opacity="0.28"/><polygon points="496.17,165.25 442.38,202.06 441.98,201.01 496.84,167.50" fill="#8b00d4" opacity="0.26880000000000004"/><polygon points="442.38,202.06 512.50,190.00 512.50,190.00 441.98,201.01" fill="#8b00d4" opacity="0.258048"/><polygon points="202.00,167.50 496.84,167.50 497.44,169.75 202.00,169.75" fill="#8b00d4" opacity="0.28"/><polygon points="496.84,167.50 441.98,201.01 441.61,199.95 497.44,169.75" fill="#8b00d4" opacity="0.26880000000000004"/><polygon points="441.98,201.01 512.50,190.00 512.50,190.00 441.61,199.95" fill="#8b00d4" opacity="0.258048"/><polygon points="202.00,169.75 497.44,169.75 497.98,172.00 202.00,172.00" fill="#8b00d4" opacity="0.28"/><polygon points="497.44,169.75 441.61,199.95 441.27,198.88 497.98,172.00