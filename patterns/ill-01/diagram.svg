<title id="ill-01-title">Köhler transmitted-light microscope</title><desc id="ill-01-desc">A lamp filament is conjugate to the condenser aperture while the field diaphragm is conjugate to the specimen. Arrows indicate connections, not calculated ray trajectories.</desc>
<defs><marker id="ill-01-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#78dfb0" stroke-width="1.5"/></marker><marker id="ill-01-reference" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#efbe71" stroke-width="1.5"/></marker><marker id="ill-01-signal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#a6b9db" stroke-width="1.5"/></marker><pattern id="ill-01-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#34465a"/></pattern></defs>
<rect width="960" height="440" fill="#101e2b"/><rect width="960" height="440" fill="url(#ill-01-grid)"/>
<g fill="none" stroke-width="2"><path d="M130,90L240,90" stroke="#78dfb0" marker-end="url(#ill-01-light)"><title>light path</title></path><path d="M320,90L440,90" stroke="#78dfb0" marker-end="url(#ill-01-light)"><title>light path</title></path><path d="M515.7770876399966,107.88854381999832L644.2229123600033,172.11145618000168" stroke="#78dfb0" marker-end="url(#ill-01-light)"><title>light path</title></path><path d="M720,190L830,190" stroke="#78dfb0" marker-end="url(#ill-01-light)"><title>light path</title></path><path d="M318.80570000581326,280.29857499854666L641.1942999941867,199.70142500145332" stroke="#78dfb0" marker-end="url(#ill-01-light)"><title>light path</title></path><path d="M280,319.9L280,350L870,350L870,230" stroke="#efbe71" marker-end="url(#ill-01-reference)"><title>field conjugates</title></path></g>
<g transform="translate(90,90)">
<title>Lamp filament: Extended source, intentionally not focused on the specimen.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(1) rotate(0)"><g transform="scale(1)"><circle r="4.5" fill="#65ff00" stroke="#333" stroke-width="1"/><line x1="6.0" y1="0.0" x2="11.0" y2="0.0" stroke="#65ff00" stroke-width="1.6" stroke-linecap="round"/><line x1="4.2" y1="4.2" x2="7.8" y2="7.8" stroke="#65ff00" stroke-width="1.6" stroke-linecap="round"/><line x1="0.0" y1="6.0" x2="0.0" y2="11.0" stroke="#65ff00" stroke-width="1.6" stroke-linecap="round"/><line x1="-4.2" y1="4.2" x2="-7.8" y2="7.8" stroke="#65ff00" stroke-width="1.6" stroke-linecap="round"/><line x1="-6.0" y1="0.0" x2="-11.0" y2="0.0" stroke="#65ff00" stroke-width="1.6" stroke-linecap="round"/><line x1="-4.2" y1="-4.2" x2="-7.8" y2="-7.8" stroke="#65ff00" stroke-width="1.6" stroke-linecap="round"/><line x1="-0.0" y1="-6.0" x2="-0.0" y2="-11.0" stroke="#65ff00" stroke-width="1.6" stroke-linecap="round"/><line x1="4.2" y1="-4.2" x2="7.8" y2="-7.8" stroke="#65ff00" stroke-width="1.6" stroke-linecap="round"/></g></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">1</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Lamp filament</tspan></text></g><g transform="translate(280,90)">
<title>Collector: Images the filament into the aperture plane.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(1) rotate(0)"><path d="M 0,-12.7 Q 9,0 0,12.7 Q -9,0 0,-12.7 Z" fill="#c9e4f5" stroke="#4a90c4" stroke-width="1.5"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">2</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Collector</tspan></text></g><g transform="translate(480,90)">
<title>Aperture diaphragm: Sets angular illumination extent.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><path d="M-13 0H13M0-13V13" stroke="#587088" stroke-width="1.5"/>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">3</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Aperture diaphragm</tspan></text></g><g transform="translate(680,190)">
<title>Condenser: Forms the field-diaphragm image at the specimen.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(1) rotate(0)"><path d="M 0,-12.7 Q 9,0 0,12.7 Q -9,0 0,-12.7 Z" fill="#c9e4f5" stroke="#4a90c4" stroke-width="1.5"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">4</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Condenser</tspan></text></g><g transform="translate(870,190)">
<title>Specimen field: Field and angular controls are independent.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(0.8571428571428571) rotate(0)"><rect x="-25" y="-3.00" width="50" height="6" fill="#c9e4f5" stroke="none"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">5</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Specimen field</tspan></text></g><g transform="translate(280,290)">
<title>Field diaphragm: Limits illuminated area; focus its rim at the specimen.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><path d="M-13 0H13M0-13V13" stroke="#587088" stroke-width="1.5"/>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">6</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Field diaphragm</tspan></text></g>
<g font-family="Arial,sans-serif" font-size="12" fill="#b3c5d4"><path d="M30 418H56" stroke="#78dfb0" stroke-width="2"/><text x="64" y="422">Optical path</text><path d="M188 418H214" stroke="#efbe71" stroke-width="2"/><text x="222" y="422">Reference / auxiliary</text><path d="M402 418H428" stroke="#a6b9db" stroke-width="2" stroke-dasharray="5 4"/><text x="436" y="422">Signal / control</text><text x="930" y="422" text-anchor="end">Arrangement map · not to scale</text></g>
</svg>
