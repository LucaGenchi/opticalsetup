<title>Cylindrical 4× anamorphic expander — OpticalSetup setup</title><desc>The powered meridian of a 25/100 mm cylindrical telescope is represented by native ideal lenses separated by 125 mm. Rays expand from 2 to 8 mm along the modeled axis. The native ideal lenses represent the powered cross-section of cylindrical optics. The unpowered transverse axis, astigmatism and a complete 2D beam cross-section are not simulated.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="-2" y="138" width="604.7" height="140" fill="#ffffff"/><polygon points="132.00,199.00 220.00,199.00 220.00,199.08 132.00,199.08" fill="#65ff00" opacity="0.28"/><polygon points="220.00,199.00 345.00,204.00 345.00,203.67 220.00,199.08" fill="#65ff00" opacity="0.28"/><polygon points="345.00,204.00 498.00,204.00 498.00,203.67 345.00,203.67" fill="#65ff00" opacity="0.28"/><polygon points="132.00,199.08 220.00,199.08 220.00,199.17 132.00,199.17" fill="#65ff00" opacity="0.28"/><polygon points="220.00,199.08 345.00,203.67 345.00,203.33 220.00,199.17" fill="#65ff00" opacity="0.28"/><polygon points="345.00,203.67 498.00,203.67 498.00,203.33 345.00,203.33" fill="#65ff00" opacity="0.28"/><polygon points="132.00,199.17 220.00,199.17 220.00,199.25 132.00,199.25" fill="#65ff00" opacity="0.28"/><polygon points="220.00,199.17 345.00,203.33 345.00,203.00 220.00,199.25" fill="#65ff00" opacity="0.28"/><polygon points="345.00,203.33 498.00,203.33 498.00,203.00 345.00,203.00" fill="#65ff00" opacity="0.28"/><polygon points="132.00,199.25 220.00,199.25 220.00,199.33 132.00,199.33" fill="#65ff00" opacity="0.28"/><polygon points="220.00,199.25 345.00,203.00 345.00,202.67 220.00,199.33" fill="#65ff00" opacity="0.28"/><polygon p