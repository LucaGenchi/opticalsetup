<title>90/10 sample and monitor split — OpticalSetup setup</title><desc>A 532 nm beam sends 90% through a sample with 50% excitation transmission and 10% to an independent reference photodiode. The traced model shows relative branch power and linear transmission; shot noise, electronics and calibrated normalization are not included.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="-2" y="142" width="702" height="324" fill="#ffffff"/><polyline points="132.00,200.00 300.00,200.00" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="300.00,200.00 300.00,381.00" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.41" stroke-linejoin="round" stroke-linecap="round" /><polyline points="300.00,200.00 450.00,200.00 631.00,200.00" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.62" stroke-linejoin="round" stroke-linecap="round" /><g transform="translate(80 200) rotate(0)"><rect x="-46" y="-17" width="92" height="34" rx="4" fill="#3a3f46" stroke="#22252a" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" letter-spacing="1.2" fill="#fff">CW LASER</text><rect x="46" y="-6" width="5" height="12" fill="#666" stroke="#444" stroke-width="1"/></g><text x="80.0" y="232.0" text-anchor="middle"  font-size="11" fill="#444">input</text><g transform="translate(300 200) rotate(90)"><rect x="-12.7" y="-12.7" width="25.4" height="25.4" fill="#c9e4f5" stroke="#4a90c4" stroke-width="1.5"/><line x1="-12.7" y1="12.7" x2="12.7" y2="-12.7" stroke="#4a90c4" stroke-width="1.5"/></g><text x="300.0" y="227.7" text-anchor="middle"  font-size="11" fill="#444">splitter</text><g transform="translate(450 200) rotate(90)"><rect x="-25" y="-3.00" width="50" height="6" fill="#c9e4f5" stroke="none"/></g><text x="450.0" y="241.0" text-anchor="middle"  font-size="11" fill="#444">sample</text><g transform="translate(650 200) rotate(0)"><rect x="-18" y="-13" width="36" height="26" rx="3" fill="#4b5563" stroke="#2b333d" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#fff">PD</text><rect x="-19.5" y="-9" width="3" height="18" fill="#93c5fd" stroke="#2b333d" stroke-width="1"/><circle cx="11" cy="-8" r="3.1" fill="#65ff00" opacity="1" stroke="#fff" stroke-width="0.8"/></g><text x="650.0" y="228.0" text-anchor="middle"  font-size="11" fill="#444">signal</text><g transform="translate(300 400) rotate(90)"><rect x="-18" y="-13" width="36" height="26" rx="3" fill="#4b5563" stroke="#2b333d" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#fff">PD</text><rect x="-19.5" y="-9" width="3" height="18" fill="#93c5fd" stroke="#2b333d" stroke-width="1"/><circle cx="11" cy="-8" r="3.1" fill="#65ff00" opacity="1" stroke="#fff" stroke-width="0.8"/></g><text x="300.0" y="433.0" text-anchor="middle"  font-size="11" fill="#444">reference</text></svg>
