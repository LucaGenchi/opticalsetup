<title>Three-phase stripe projection — OpticalSetup setup</title><desc>A real binary DMD selects a 10 mm pitch ON pattern and directs it downward through a 75 mm projection lens. The tilted receiving camera follows the tilted modulator-plane conjugacy. Native binary micromirror routing and geometric projection are traced. No sinusoidal fringe synthesis, three-frame phase reconstruction, diffraction orders or structured-illumination resolution gain is calculated.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="-182" y="132.91118490514242" width="584.1803074551954" height="635.8595850167465" fill="#ffffff"/><polygon points="112.00,187.55 264.30,187.55 266.87,189.21 112.00,189.21" fill="#65ff00" opacity="0.28"/><polygon points="112.00,189.21 266.87,189.21 269.43,190.88 112.00,190.88" fill="#65ff00" opacity="0.28"/><polygon points="266.87,189.21 266.87,357.55 269.43,357.55 269.43,190.88" fill="#65ff00" opacity="0.28"/><polygon points="266.87,357.55 317.78,492.82 316.10,493.91 269.43,357.55" fill="#65ff00" opacity="0.28"/><polygon points="112.00,190.88 269.43,190.88 272.00,192.55 112.00,192.55" fill="#65ff00" opacity="0.28"/><polygon points="112.00,192.55 272.00,192.55 274.57,194.21 112.00,194.21" fill="#65ff00" opacity="0.28"/><polygon points="112.00,194.21 274.57,194.21 277.13,195.88 112.00,195.88" fill="#65ff00" opacity="0.28"/><polygon points="274.57,194.21 274.57,357.55 277.13,357.55 277.13,195.88" fill="#65ff00" opacity="0.28"/><polygon points="274.57,357.55 312.53,496.23 310.64,497.45 277.13,357.55" fill="#65ff00" opacity="0.28"/><polygon points="112.00,195.88 277.13,195.88 279.70,197.55 112.00,197.55" fill="#65ff00" opacity="0.28"/><polygon points="112.00,197.55 