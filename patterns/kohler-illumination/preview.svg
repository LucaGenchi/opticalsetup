<title>Köhler transmitted-light microscope — OpticalSetup setup</title><desc>Three native point emitters sample an extended lamp. A 25.455 mm collector conjugates the lamp to the condenser front focal plane; the field stop is conjugate to the specimen camera. Native 2D geometrical rays are computed. Diffraction, target-image irradiance and real-lens aberrations are not calculated; ideal object-image markers are separate paraxial constructions. The three-point lamp is a discrete extended-source sample, not a uniform illumination calculation.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="19" y="137" width="416.4" height="142" fill="#ffffff"/><polyline points="80.00,197.00 120.00,202.62 190.00,205.25" fill="none" stroke="#a3ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="80.00,197.00 120.00,200.73 190.00,205.25" fill="none" stroke="#a3ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="80.00,197.00 120.00,198.86 190.00,205.25" fill="none" stroke="#a3ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="80.00,197.00 120.00,197.00 190.00,205.25" fill="none" stroke="#a3ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="80.00,197.00 120.00,195.14 190.00,205.25" fill="none" stroke="#a3ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="80.00,197.00 120.00,193.27 190.00,205.25" fill="none" stroke="#a3ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="80.00,