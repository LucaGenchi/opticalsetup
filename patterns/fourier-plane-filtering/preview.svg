<title>4f low-pass spatial filter — OpticalSetup setup</title><desc>A real 100/100 mm 4f relay exposes its common focal plane at x = 280 mm. A native 8 mm slit at that plane selects angular content before the image camera. Native 2D geometrical rays are computed. Diffraction, target-image irradiance and real-lens aberrations are not calculated; ideal object-image markers are separate paraxial constructions. The optical layout is real; the tracer does not Fourier-transform a target image or calculate low-pass image contrast.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="31.4" y="137" width="522.6" height="142" fill="#ffffff"/><polyline points="81.00,200.00 180.00,206.92 280.00,206.99" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="81.00,200.00 180.00,204.61 280.00,204.66" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="81.00,200.00 180.00,202.30 380.00,202.35 480.00,200.02" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="81.00,200.00 180.00,200.00 380.00,200.00 480.00,200.00" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="81.00,200.00 180.00,197.70 380.00,197.65 480.00,199.98" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="81.00,200.00 180.00,195.39 280.00,195.34" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="81.00,200.00 180.00,193.08 280.00,193.01" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="479.76,198.00 479.76,202.00" fill="none" stroke="#65ff00" stroke-width="2.2" opacity="0.85" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/><polyline points="479.76,202.00 481.68,202.00" fill="none" stroke="#65ff00" stroke-width="2.2" opacity="0.85" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/><polyline points="479.76,200.20 481.20,200.20" fill="none" stroke="#65ff00" stroke-width="2.2" opacity="0.85" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/><g transform="translate(80 200) rotate(0)"><line x1="-7" y1="0" x2="7" y2="0" stroke="#888" stroke-width="1.2"/><polyline points="-0.2,2.0 -0.2,-2.0" fill="none" stroke="#65ff00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="-0.2,-2.0 1.7,-2.0" fill="none" stroke="#65ff00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="-0.2,-0.2 1.2,-0.2" fill="none" stroke="#65ff00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="80.0" y="222.0" text-anchor="middle"  font-size="11" fill="#444">object</text><g transform="translate(180 200) rotate(0)"><path d="M 0,-25 Q 9,0 0,25 Q -9,0 0,-25 Z" fill="#c9e4f5" stroke="#4a90c4" stroke-width="1.5"/></g><text x="180.0" y="241.0" text-anchor="middle"  font-size="11" fill="#444">first</text><g transform="translate(380 200) rotate(0)"><path d="M 0,-25 Q 9,0 0,25 Q -9,0 0,-25 Z" fill="#c9e4f5" stroke="#4a90c4" stroke-width="1.5"/></g><text x="380.0" y="241.0" text-anchor="middle"  font-size="11" fill="#444">second</text><g transform="translate(502 200) rotate(0)"><rect x="-20" y="-30" width="40" height="60" rx="3" fill="#4b5563" stroke="#2b333d" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#fff">CAM</text><rect x="-24" y="-22" width="5" height="44" fill="#333" stroke="#2b333d"/><circle cx="13" cy="-23" r="3.1" fill="#65ff00" opacity="1" stroke="#fff" stroke-width="0.8"/></g><text x="502.0" y="245.0" text-anchor="middle"  font-size="11" fill="#444">image</text><g transform="translate(280 200) rotate(0)"><rect x="-2.5" y="-30" width="5" height="26" fill="#333"/><rect x="-2.5" y="4" width="5" height="26" fill="#333"/></g><text x="280.0" y="246.0" text-anchor="middle"  font-size="11" fill="#444">fourier-stop</text></svg>
