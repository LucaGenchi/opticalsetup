<title>Native intensity-autocorrelation instrument — OpticalSetup setup</title><desc>A native 800 nm, 150 fs Gaussian pulse enters the autocorrelator and its linked display. The instrument calculates the correlation width and infers pulse duration using the selected shape factor. This is the native packaged autocorrelator, not a fake drawn internal beam split. The inferred duration depends on shape assumptions; full spectral phase is not recovered.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="18" y="151" width="589.8" height="308.2" fill="#ffffff"/><polygon points="152.00,198.50 442.00,198.50 442.00,198.63 152.00,198.63" fill="#8b1a1a" opacity="0.28"/><polygon points="152.00,198.63 442.00,198.63 442.00,198.75 152.00,198.75" fill="#8b1a1a" opacity="0.28"/><polygon points="152.00,198.75 442.00,198.75 442.00,198.88 152.00,198.88" fill="#8b1a1a" opacity="0.28"/><polygon points="152.00,198.88 442.00,198.88 442.00,199.00 152.00,199.00" fill="#8b1a1a" opacity="0.28"/><polygon points="152.00,199.00 442.00,199.00 442.00,199.13 152.00,199.13" fill="#8b1a1a" opacity="0.28"/><polygon points="152.00,199.13 442.00,199.13 442.00,199.25 152.00,199.25" fill="#8b1a1a" opacity="0.28"/><polygon points="152.00,199.25 442.00,199.25 442.00,199.38 152.00,199.38" fill="#8b1a1a" opacity="0.28"/><polygon points="152.00,199.38 442.00,199.38 442.00,199.50 152.00,199.50" fill="#8b1a1a" opacity="0.28"/><polygon points="152.00,199.50 442.00,199.50 442.00,199.63 152.00,199.63" fill="#8b1a1a" opacity="0.28"/><polygon points="152.00,199.63 442.00,199.63 442.00,199.75 152.00,199.75" fill="#8b1a1a" opacity="0.28"/><polygon points="152.00,199.75 442.00,199.75 442.00,199.88 152.00,199.88" fill="#8b1a1