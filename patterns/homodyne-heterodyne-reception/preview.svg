<title>10 MHz heterodyne receiver — OpticalSetup setup</title><desc>Two real native laser sources enter orthogonal ports of a 50/50 optical coupler. A nominal 10 MHz optical-frequency offset is encoded by a roughly 0.00008014 nm wavelength separation near 1550 nm. The optical heterodyne mixing layout and branch powers are traced. Static camera readout does not simulate a 10 MHz temporal beat, balanced RF receiver or coherent phase locking of independent lasers.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="-2" y="-2" width="626" height="492" fill="#ffffff"/><polyline points="132.00,200.00 350.00,200.00" fill="none" stroke="#6e3b3b" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="350.00,200.00 350.00,400.00" fill="none" stroke="#6e3b3b" stroke-width="2" opacity="0.6499999999999999" stroke-linejoin="round" stroke-linecap="round" /><polyline points="350.00,200.00 550.00,200.00" fill="none" stroke="#6e3b3b" stroke-width="2" opacity="0.6499999999999999" stroke-linejoin="round" stroke-linecap="round" /><polyline points="350.00,132.00 350.00,200.00" fill="none" stroke="#6e3b3b" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="350.00,200.00 550.00,200.00" fill="none" stroke="#6e3b3b" stroke-width="2" opacity="0.6499999999999999" stroke-linejoin="round" stroke-linecap="round" /><polyline points="350.00,200.00 350.00,400.00" fill="none" stroke="#6e3b3b" stroke-width="2" opacity="0.6499999999999999" stroke-linejoin="round" stroke-linecap="round" /><g transform="translate(80 200) rotate(0)"><rect x="-46" y="-17" width="92" height="34" rx="4" fill="#3a3f46" stroke="#22252a" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" letter-spacing="1.2" fill="#fff">CW LASER</text><rect x="46" y="-6" width="5" height="12" fill="#666" stroke="#444" stroke-width="1"/></g><text x="80.0" y="232.0" text-anchor="middle"  font-size="11" fill="#444">signal</text><g transform="translate(350 80) rotate(90)"><rect x="-46" y="-17" width="92" height="34" rx="4" fill="#3a3f46" stroke="#22252a" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" letter-spacing="1.2" fill="#fff">CW LASER</text><rect x="46" y="-6" width="5" height="12" fill="#666" stroke="#444" stroke-width="1"/></g><text x="350.0" y="145.0" text-anchor="middle"  font-size="11" fill="#444">LO</text><g transform="translate(350 200) rotate(90)"><rect x="-12.7" y="-12.7" width="25.4" height="25.4" fill="#c9e4f5" stroke="#4a90c4" stroke-width="1.5"/><line x1="-12.7" y1="12.7" x2="12.7" y2="-12.7" stroke="#4a90c4" stroke-width="1.5"/></g><text x="350.0" y="227.7" text-anchor="middle"  font-size="11" fill="#444">mixing-coupler</text><g transform="translate(572 200) rotate(0)"><rect x="-20" y="-30" width="40" height="60" rx="3" fill="#4b5563" stroke="#2b333d" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#fff">CAM</text><rect x="-24" y="-22" width="5" height="44" fill="#333" stroke="#2b333d"/><circle cx="13" cy="-23" r="3.1" fill="#ff8989" opacity="1" stroke="#fff" stroke-width="0.8"/></g><text x="572.0" y="245.0" text-anchor="middle"  font-size="11" fill="#444">port-A</text><g transform="translate(350 422) rotate(90)"><rect x="-20" y="-30" width="40" height="60" rx="3" fill="#4b5563" stroke="#2b333d" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#fff">CAM</text><rect x="-24" y="-22" width="5" height="44" fill