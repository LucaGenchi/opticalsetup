<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" class="pattern-diagram" role="img" aria-labelledby="cav-06-title cav-06-desc">
<!-- SPDX-FileCopyrightText: 2026 Luca Genchi and contributors
     SPDX-License-Identifier: GPL-3.0-or-later -->
<title id="cav-06-title">Loss-controlled Q-switched resonator</title><desc id="cav-06-desc">An illustrative 1064 nm resonator stores inversion with an acousto-optic loss gate active, then rapidly lowers loss to produce a pulse through a fixed output coupler. Arrows indicate connections, not calculated ray trajectories.</desc>
<defs><marker id="cav-06-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#78dfb0" stroke-width="1.5"/></marker><marker id="cav-06-reference" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#efbe71" stroke-width="1.5"/></marker><marker id="cav-06-signal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#a6b9db" stroke-width="1.5"/></marker><pattern id="cav-06-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#34465a"/></pattern></defs>
<rect width="960" height="440" fill="#101e2b"/><rect width="960" height="440" fill="url(#cav-06-grid)"/>
<g fill="none" stroke-width="2"><path d="M123.67516555855495,106.58664458881728L251.32483444144503,188.41335541118272" stroke="#78dfb0" marker-end="url(#cav-06-light)"><title>pump energy</title></path><path d="M123.67516555855495,313.4133554111827L251.32483444144503,231.58664458881728" stroke="#78dfb0" marker-end="url(#cav-06-light)"><title>circulation</title></path><path d="M325,210L440,210" stroke="#78dfb0" marker-end="url(#cav-06-light)"><title>cavity field</title></path><path d="M520,210L640,210" stroke="#78dfb0" marker-end="url(#cav-06-light)"><title>selected low-loss path</title></path><path d="M680,250L680,335L130,335" stroke="#78dfb0" marker-end="url(#cav-06-light)"><title>round trip</title></path><path d="M720,210L835,210" stroke="#78dfb0" marker-end="url(#cav-06-light)"><title>output</title></path></g>
<g transform="translate(90,85)">
<title>Pump source: Builds population inversion while oscillation is suppressed.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><path d="M-13 0H13M0-13V13" stroke="#587088" stroke-width="1.5"/>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">1</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Pump source</tspan></text></g><g transform="translate(285,210)">
<title>Nd:YAG gain: Energy is stored in excited populations.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(1) rotate(0)"><path d="M -12,-11 L 16,-11 L 12,11 L -16,11 Z" fill="#e4d5f2" stroke="#8a5fb0" stroke-width="1.5"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">2</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Nd:YAG gain</tspan></text></g><g transform="translate(90,335)">
<title>High reflector: Closes one cavity end.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(1) rotate(0)"><line x1="0" y1="-12.7" x2="0" y2="12.7" stroke="#444" stroke-width="3.5"/><line x1="-1.5" y1="-12.7" x2="-7.5" y2="-6.699999999999999" stroke="#888" stroke-width="1"/><line x1="-1.5" y1="-6.233333333333333" x2="-7.5" y2="-0.2333333333333334" stroke="#888" stroke-width="1"/><line x1="-1.5" y1="0.2333333333333325" x2="-7.5" y2="6.2333333333333325" stroke="#888" stroke-width="1"/><line x1="-1.5" y1="6.699999999999999" x2="-7.5" y2="12.7" stroke="#888" stroke-width="1"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">3</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">High reflector</tspan></text></g><g transform="translate(480,210)">
<title>Acousto-optic loss gate: High-loss then low-loss switching changes cavity Q.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(1) rotate(0)"><rect x="-20" y="-13" width="40" height="26" rx="3" fill="#c9b458" stroke="#8a7a2e" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#3d3616">AOM</text></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">4</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Acousto-optic loss</tspan><tspan x="0" y="65">gate</tspan></text></g><g transform="translate(680,210)">
<title>Fixed output coupler: Transmits a constant fraction during the pulse.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(1) rotate(0)"><line x1="0" y1="-12.7" x2="0" y2="12.7" stroke="#444" stroke-width="3.5"/><line x1="-1.5" y1="-12.7" x2="-7.5" y2="-6.699999999999999" stroke="#888" stroke-width="1"/><line x1="-1.5" y1="-6.233333333333333" x2="-7.5" y2="-0.2333333333333334" stroke="#888" stroke-width="1"/><line x1="-1.5" y1="0.2333333333333325" x2="-7.5" y2="6.2333333333333325" stroke="#888" stroke-width="1"/><line x1="-1.5" y1="6.699999999999999" x2="-7.5" y2="12.7" stroke="#888" stroke-width="1"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">5</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Fixed output coupler</tspan></text></g><g transform="translate(875,210)">
<title>Nanosecond pulse port: Pulse duration depends on dynamics, not just gate width.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><path d="M-13 0H13M0-13V13" stroke="#587088" stroke-width="1.5"/>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">6</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Nanosecond pulse port</tspan></text></g>
<g font-family="Arial,sans-serif" font-size="12" fill="#b3c5d4"><path d="M30 418H56" stroke="#78dfb0" stroke-width="2"/><text x="64" y="422">Optical path</text><path d="M188 418H214" stroke="#efbe71" stroke-width="2"/><text x="222" y="422">Reference / auxiliary</text><path d="M402 418H428" stroke="#a6b9db" stroke-width="2" stroke-dasharray="5 4"/><text x="436" y="422">Signal / control</text><text x="930" y="422" text-anchor="end">Arrangement map · not to scale</text></g>
</svg>
