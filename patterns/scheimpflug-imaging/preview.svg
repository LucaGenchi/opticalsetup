<title>Tilted-plane inspection camera — OpticalSetup setup</title><desc>Three emitting points lie on a plane tilted 26.565° in the meridional section. A 100 mm lens images them onto a camera plane tilted by the opposite geometric slope. Native 2D geometrical rays are computed. Diffraction, target-image irradiance and real-lens aberrations are not calculated; ideal object-image markers are separate paraxial constructions. This is a three-point plane-conjugacy example; it does not render a continuous tilted target or predict depth of field.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="-74.1" y="127" width="564.0773982019981" height="176.2433402239946" fill="#ffffff"/><polyline points="-9.00,180.00 200.00,194.61 390.88,218.24" fill="none" stroke="#ff7700" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="-9.00,180.00 200.00,189.73 390.89,218.22" fill="none" stroke="#ff7700" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="-9.00,180.00 200.00,184.86 390.90,218.20" fill="none" stroke="#ff7700" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="-9.00,180.00 200.00,180.00 390.91,218.18" fill="none" stroke="#ff7700" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="-9.00,180.00 200.00,175.14 390.92,218.16" fill="none" stroke="#ff7700" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="-9.00,180.00 200.00,170.27 390.93,218.14" fill="none" stroke="#ff7700" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round"