<title>Manual sensorless defocus optimization on a native camera — OpticalSetup setup</title><desc>A native deformable mirror sends a finite-width beam to a camera. Its focal-length control changes paraxial convergence; the camera spot provides the metric without a separate wavefront sensor. The scene supports manual image-metric adjustment of native tip/tilt and defocus. It has no automated coefficient search, higher-order wavefront correction or sample-dependent optimization guarantee.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="18" y="138.8873016277919" width="464" height="433.1126983722081" fill="#ffffff"/><polygon points="152.00,194.00 394.00,194.00 394.50,194.50 152.00,194.50" fill="#65ff00" opacity="0.28"/><polygon points="394.00,194.00 395.28,498.00 395.68,498.00 394.50,194.50" fill="#65ff00" opacity="0.28"/><polygon points="152.00,194.50 394.50,194.50 395.00,195.00 152.00,195.00" fill="#65ff00" opacity="0.28"/><polygon points="394.50,194.50 395.68,498.00 396.07,498.00 395.00,195.00" fill="#65ff00" opacity="0.28"/><polygon points="152.00,195.00 395.00,195.00 395.50,195.50 152.00,195.50" fill="#65ff00" opacity="0.28"/><polygon points="395.00,195.00 396.07,498.00 396.46,498.00 395.50,195.50" fill="#65ff00" opacity="0.28"/><polygon points="152.00,195.50 395.50,195.50 396.00,196.00 152.00,196.00" fill="#65ff00" opacity="0.28"/><polygon points="395.50,195.50 396.46,498.00 396.85,498.00 396.00,196.00" fill="#65ff00" opacity="0.28"/><polygon points="152.00,196.00 396.00,196.00 396.50,196.50 152.00,196.50" fill="#65ff00" opacity="0.28"/><polygon points="396.00,196.00 396.85,498.00 397.24,498.00 396.50,196.50" fill="#65ff00" opacity="0.28"/><polygon points="152.0