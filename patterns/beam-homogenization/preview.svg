<title>Fly-eye homogenizer — OpticalSetup setup</title><desc>Two real three-lens arrays form three meridional beamlet channels, followed by a 100 mm field lens. The camera receives their overlapping geometrical contributions. The arrays are actual separate native lenses in one meridional section. Beamlet paths and overlap are computed; coherent speckle, 2D fly-eye uniformity and microlens diffraction are not.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="-2" y="118" width="544.3" height="180" fill="#ffffff"/><polygon points="132.00,185.00 200.00,185.00 200.00,186.25 132.00,186.25" fill="#65ff00" opacity="0.28"/><polygon points="200.00,185.00 250.00,190.00 250.00,190.00 200.00,186.25" fill="#65ff00" opacity="0.28"/><polygon points="250.00,190.00 350.00,200.00 350.00,197.50 250.00,190.00" fill="#65ff00" opacity="0.28"/><polygon points="350.00,200.00 450.00,210.00 450.00,207.50 350.00,197.50" fill="#65ff00" opacity="0.28"/><polygon points="132.00,186.25 200.00,186.25 200.00,187.50 132.00,187.50" fill="#65ff00" opacity="0.28"/><polygon points="200.00,186.25 250.00,190.00 250.00,190.00 200.00,187.50" fill="#65ff00" opacity="0.28"/><polygon points="250.00,190.00 350.00,197.50 350.00,195.00 250.00,190.00" fill="#65ff00" opacity="0.28"/><polygon points="350.00,197.50 450.00,207.50 450.00,205.00 350.00,195.00" fill="#65ff00" opacity="0.28"/><polygon points="132.00,187.50 200.00,187.50 200.00,188.75 132.00,188.75" fill="#65ff00" opacity="0.28"/><polygon points="200.00,187.50 250.00,190.00 250.00,190.00 200.00,188.75" fill="#65ff00" opacity="0.28"/><polygon points="250.00,190.00 350.00,195.00 350.00,192.50 250.00,190.00" fill="#65ff00" opacity="0.28"/><polygon points="350.00