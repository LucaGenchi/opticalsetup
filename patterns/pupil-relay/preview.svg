<title>Twofold pupil relay — OpticalSetup setup</title><desc>A real galvo and 75/150 mm relay image its pivot onto a pupil-monitor camera. A 3 mm collimated beam expands to 6 mm in the relayed pupil. Native 2D geometrical rays are computed. Diffraction, target-image irradiance and real-lens aberrations are not calculated; ideal object-image markers are separate paraxial constructions. The objective pupil is represented by the receiving camera plane; this is the pupil-relay subsystem, not a full microscope.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="-22" y="22.42283553372465" width="284" height="597.5771644662753" fill="#ffffff"/><polygon points="112.00,78.50 198.50,78.50 198.63,78.63 112.00,78.63" fill="#65ff00" opacity="0.28"/><polygon points="198.50,78.50 198.50,155.00 198.63,155.00 198.63,78.63" fill="#65ff00" opacity="0.28"/><polygon points="198.50,155.00 203.00,380.00 202.75,380.00 198.63,155.00" fill="#65ff00" opacity="0.28"/><polygon points="203.00,380.00 203.00,530.00 202.75,530.00 202.75,380.00" fill="#65ff00" opacity="0.28"/><polygon points="112.00,78.63 198.63,78.63 198.75,78.75 112.00,78.75" fill="#65ff00" opacity="0.28"/><polygon points="198.63,78.63 198.63,155.00 198.75,155.00 198.75,78.75" fill="#65ff00" opacity="0.28"/><polygon points="198.63,155.00 202.75,380.00 202.50,380.00 198.75,155.00" fill="#65ff00" opacity="0.28"/><polygon points="202.75,380.00 202.75,530.00 202.50,530.00 202.50,380.00" fill="#65ff00" opacity="0.28"/><polygon points="112.00,78.75 198.75,78.75 198.88,78.88 112.00,78.88" fill="#65ff00" opacity="0.28"/><polygon points="198.75,78.75 198.75,155.00 198.88,155.00 198.88,78.88" fill="#65ff00" opacity="0.28"/><polygon points="198