<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" class="pattern-diagram" role="img" aria-labelledby="wave-01-title wave-01-desc">
<!-- SPDX-FileCopyrightText: 2026 Luca Genchi and contributors
     SPDX-License-Identifier: GPL-3.0-or-later -->
<title id="wave-01-title">Pupil-conjugate adaptive-optics feedback</title><desc id="wave-01-desc">An illustrative 37-actuator deformable mirror corrects a pupil conjugate. A 10% sensing branch feeds a Shack–Hartmann sensor; a controller updates the mirror while the science camera uses the main branch. Arrows indicate connections, not calculated ray trajectories.</desc>
<defs><marker id="wave-01-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#78dfb0" stroke-width="1.5"/></marker><marker id="wave-01-reference" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#efbe71" stroke-width="1.5"/></marker><marker id="wave-01-signal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#a6b9db" stroke-width="1.5"/></marker><pattern id="wave-01-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#34465a"/></pattern></defs>
<rect width="960" height="440" fill="#101e2b"/><rect width="960" height="440" fill="url(#wave-01-grid)"/>
<g fill="none" stroke-width="2"><path d="M130,85L245,85" stroke="#78dfb0" marker-end="url(#wave-01-light)"><title>aberrated input</title></path><path d="M325,85L440,85" stroke="#78dfb0" marker-end="url(#wave-01-light)"><title>corrected field</title></path><path d="M520,85L640,85" stroke="#78dfb0" marker-end="url(#wave-01-light)"><title>90% science</title></path><path d="M480,125L480,270" stroke="#78dfb0" marker-end="url(#wave-01-light)"><title>10% sensing</title></path><path d="M440,310L325,310" stroke="#a6b9db" stroke-dasharray="6 5" marker-end="url(#wave-01-signal)"><title>measured slopes</title></path><path d="M285,270L285,125" stroke="#a6b9db" stroke-dasharray="6 5" marker-end="url(#wave-01-signal)"><title>actuator feedback</title></path></g>
<g transform="translate(90,85)">
<title>Aberrated incoming field: Atmospheric or specimen aberrations are upstream of the corrector.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><path d="M-13 0H13M0-13V13" stroke="#587088" stroke-width="1.5"/>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">1</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Aberrated incoming</tspan><tspan x="0" y="65">field</tspan></text></g><g transform="translate(285,85)">
<title>Pupil-conjugate DM: Actuator commands change the shared pupil wavefront.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(0.8571428571428571) rotate(0)"><rect x="8" y="-25" width="4" height="50" fill="#4d565f"/><rect x="4" y="-23" width="4" height="4" fill="#8d98a5"/><rect x="4" y="-16" width="4" height="4" fill="#8d98a5"/><rect x="4" y="-9" width="4" height="4" fill="#8d98a5"/><rect x="4" y="-2" width="4" height="4" fill="#8d98a5"/><rect x="4" y="5" width="4" height="4" fill="#8d98a5"/><rect x="4" y="12" width="4" height="4" fill="#8d98a5"/><rect x="4" y="19" width="4" height="4" fill="#8d98a5"/><path d="M 0,-25 Q 3,-18.75 0,-12.5 Q -3,-6.25 0,0 Q 3,6.25 0,12.5 Q -3,18.75 0,25" fill="none" stroke="#444" stroke-width="2.5"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">2</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Pupil-conjugate DM</tspan></text></g><g transform="translate(480,85)">
<title>90:10 sensing split: Both branches share correction before splitting.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(1) rotate(0)"><rect x="-12.7" y="-12.7" width="25.4" height="25.4" fill="#c9e4f5" stroke="#4a90c4" stroke-width="1.5"/><line x1="-12.7" y1="12.7" x2="12.7" y2="-12.7" stroke="#4a90c4" stroke-width="1.5"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">3</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">90:10 sensing split</tspan></text></g><g transform="translate(680,85)">
<title>Science camera: Records the corrected target field.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(1) rotate(0)"><rect x="-20" y="-15" width="40" height="30" rx="3" fill="#4b5563" stroke="#2b333d" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#fff">CAM</text><rect x="-24" y="-7" width="5" height="14" fill="#333" stroke="#2b333d"/><circle cx="13" cy="-8" r="3.1" fill="#88919b" opacity="0.45" stroke="#fff" stroke-width="0.8"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">4</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Science camera</tspan></text></g><g transform="translate(480,310)">
<title>Shack–Hartmann sensor: Lenslet spot displacements estimate local wavefront slopes.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><path d="M-13 0H13M0-13V13" stroke="#587088" stroke-width="1.5"/>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">5</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Shack–Hartmann sensor</tspan></text></g><g transform="translate(285,310)">
<title>Slope reconstructor: Converts sensed slopes into bounded actuator commands.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><path d="M-13 0H13M0-13V13" stroke="#587088" stroke-width="1.5"/>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">6</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Slope reconstructor</tspan></text></g>
<g font-family="Arial,sans-serif" font-size="12" fill="#b3c5d4"><path d="M30 418H56" stroke="#78dfb0" stroke-width="2"/><text x="64" y="422">Optical path</text><path d="M188 418H214" stroke="#efbe71" stroke-width="2"/><text x="222" y="422">Reference / auxiliary</text><path d="M402 418H428" stroke="#a6b9db" stroke-width="2" stroke-dasharray="5 4"/><text x="436" y="422">Signal / control</text><text x="930" y="422" text-anchor="end">Arrangement map · not to scale</text></g>
</svg>
