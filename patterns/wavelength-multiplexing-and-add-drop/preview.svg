<title>Native three-channel add/drop bus — OpticalSetup setup</title><desc>Three spatially separated lasers at 1530, 1550 and 1570 nm enter a common free-space bus through two wavelength-selective combining dichroics. A 1550 nm band-reflecting dichroic drops the middle wavelength; a second band reflector adds a separate 1550 nm source. This is a native free-space wavelength-routing equivalent, not a microring or fiber network. Ideal dichroic bands omit guided coupling, insertion-loss spectra, linewidth, channel crosstalk and encoded data.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="-12" y="-132" width="1173" height="598" fill="#ffffff"/><polyline points="122.00,200.00 270.00,200.00 470.00,200.00 680.00,200.00 900.00,200.00 1073.00,200.00" fill="none" stroke="#6e3b3b" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="270.00,2.00 270.00,200.00 470.00,200.00 680.00,200.00 680.00,381.00" fill="none" stroke="#6e3b3b" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="470.00,2.00 470.00,200.00 680.00,200.00 900.00,200.00 1073.00,200.00" fill="none" stroke="#6e3b3b" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="900.00,2.00 900.00,200.00 1073.00,200.00" fill="none" stroke="#6e3b3b" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><g transform="translate(70 200) rotate(0)"><rect x="-46" y="-17" width="92" height="34" rx="4" fill="#3a3f46" stroke="#22252a" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" letter-spacing="1.2" fill="#fff">CW LASER</text><rect x="46" y="-6" width="5" height="12" fill="#666" stroke="#444" stroke-width="1"/></g><text x="70.0" y="232.0" text-anchor="middle"  font-size="11" fill="#444">carrier-1530</text><g transform="translate(270 -50) rotate(90)"><rect x="-46" y="-17" width="92" height="34" rx="4" fill="#3a3f46" stroke="#22252a" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" letter-spacing="1.2" fill="#fff">CW LASER</text><rect x="46" y="-6" width="5" height="12" fill="#666" stroke="#444" stroke-width="1"/></g><text x="270.0" y="15.0" text-anchor="middle"  font-size="11" fill="#444">carrier-1550</text><g transform="translate(470 -50) rotate(90)"><rect x="-46" y="-17" width="92" height="34" rx="4" fill="#3a3f46" stroke="#22252a" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" letter-spacing="1.2" fill="#fff">CW LASER</text><rect x="46" y="-6" width="5" height="12" fill="#666" stroke="#444" stroke-width="1"/></g><text x="470.0" y="15.0" text-anchor="middle"  font-size="11" fill="#444">carrier-1570</text><g transform="translate(270 200) rotate(315)"><rect x="-3" y="-20" width="6" height="40" fill="#dfeef7" stroke="#5d7f96" stroke-width="1.5"/><line x1="-3" y1="-20" x2="-3" y2="20" stroke="#b04ad0" stroke-width="2"/></g><text x="270.0" y="234.2" text-anchor="middle"  font-size="11" fill="#444">combine-1550</text><g transform="translate(470 200) rotate(315)"><rect x="-3" y="-20" width="6" height="40" fill="#dfeef7" stroke="#5d7f96" stroke-width="1.5"/><line x1="-3" y1="-20" x2="-3" y2="20" stroke="#b04ad0" stroke-width="2"/></g><text x="470.0" y="234.2" text-anchor="middle"  font-size="11" fill="#444">combine-1570</text><g transform="translate(680 200) rotate(315)"><rect x="-3" y="-20" width="6" height="40" fill="#dfeef7" stroke="#5d7f96" stroke-width="1.5"/><line x1="-3" y1="-20" x2="-3" y2="20" stroke="#b04ad0" stroke-width="2"/></g><text x="680.0" y="234.2" text-anchor="middle"  font-size="11" fill="#444">drop-filter</text><g transform="translate(680 400) rotate(90)"><rect x="-18" y="-13" width="36" height="26" rx="3" fill="#4b5563" stroke="#2b333d" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#fff">PD</text><rect x="-19.5" y="-9" width="3" height="18" fill="#93c5fd" stroke="#2b333d" stroke-width="1"/><circle cx="11" cy="-8" r="3.1" fill="#ff8989" opacity="1" stroke="#fff" stroke-width="0.8"/></g><text x="680.0" y="433.0" text-anchor="middle"  font-size="11" fill="#444">drop-detector</text><g transform="translate(900 200) rotate(315)"><rect x="-3" y="-20" width="6" height="40" fill="#dfeef7" stroke="#5d7f96" stroke-width="1.5"/><line x1="-3" y1="-20" x2="-3" y2="20" stroke="#b04ad0" stroke-width="2"/></g><text x="900.0" y="234.2" text-anchor="middle"  font-size="11" fill="#444">add-filter</text><g transform="translate(900 -50) rotate(90)"><rect x="-46" y="-17" width="92" height="34" rx="4" fill="#3a3f46" stroke="#22252a" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" letter-spacing="1.2" fill="#fff">CW LASER</text><rect x="46" y="-6" width="5" height="12" fill="#666" stroke="#444" stroke-width="1"/></g><text x="900.0" y="15.0" text-anchor="middle"  font-size="11" fill="#444">replacement</text><g transform="translate(1100 200) rotate(0)"><rect x="-27" y="-15" width="54" height="30" rx="4" fill="#44505d" stroke="#202a33" stroke-width="1.5"/><rect x="-28.7" y="-11" width="3.4" height="22" rx="1" fill="#fde68a" stroke="#26323c" stroke-width="0.8"/><text x="1" y="1"  text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="720" letter-spacing="0.4" fill="#fff">SPEC</text><circle cx="19" cy="-8" r="3" fill="#ff8989" opacity="1" stroke="#fff" stroke-width="0.8"/></g><text x="1100.0" y="230.0" text-anchor="m