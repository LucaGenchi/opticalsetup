<title>Two-curved-mirror passive resonator — OpticalSetup setup</title><desc>An external native 1064 nm source weakly couples through the first of two partially transmitting curved mirrors separated by 300 mm. A leaked-light detector is outside the right mirror. This is a passive, externally injected cavity geometry. The renderer shows finite traced passes, not resonant buildup, a Gaussian eigenmode, longitudinal resonance or laser gain.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="-2" y="147" width="702" height="106" fill="#ffffff"/><polyline points="132.00,200.00 200.00,200.00" fill="none" stroke="#8b1a1a" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="200.00,200.00 500.00,200.00" fill="none" stroke="#8b1a1a" stroke-width="2" opacity="0.38" stroke-linejoin="round" stroke-linecap="round" /><polyline points="500.00,200.00 631.00,200.00" fill="none" stroke="#8b1a1a" stroke-width="2" opacity="0.3515" stroke-linejoin="round" stroke-linecap="round" /><polyline points="500.00,200.00 200.00,200.00" fill="none" stroke="#8b1a1a" stroke-width="2" opacity="0.3785" stroke-linejoin="round" stroke-linecap="round" /><polyline points="200.00,200.00 126.00,200.00" fill="none" stroke="#8b1a1a" stroke-width="2" opacity="0.351425" stroke-linejoin="round" stroke-linecap="round" /><polyline points="200.00,200.00 500.00,200.00" fill="none" stroke="#8b1a1a" stroke-width="2" opacity="0.377075" stroke-linejoin="round" stroke-linecap="round" /><polyline points="500.00,200.00 631.00,200.00" fill="none" stroke="#8b1a1a" stroke-width="2" opacity="0.35135374999999996" stroke-linejoin="round" stroke-linecap="round" /><polyline points="500.00,