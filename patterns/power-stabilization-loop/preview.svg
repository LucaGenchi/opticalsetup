<title>Native open-loop power actuator and monitor — OpticalSetup setup</title><desc>A 532 nm beam passes a neutral-density actuator and a 95:5 beamsplitter. Native power meters measure delivered and sampled power with the source set to 10 mW. This is the physical measurement/attenuation branch of a stabilization loop, operated manually. A feedback controller, electronic setpoint and automatic stabilization are unavailable; the scene makes no closed-loop stability or bandwidth claim.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="-12" y="51" width="597" height="280" fill="#ffffff"/><polygon points="122.00,98.50 230.00,98.50 230.00,98.63 122.00,98.63" fill="#65ff00" opacity="0.28"/><polygon points="230.00,98.50 348.50,98.50 348.63,98.63 230.00,98.63" fill="#65ff00" opacity="0.22400000000000003"/><polygon points="348.50,98.50 348.50,236.00 348.62,236.00 348.63,98.63" fill="#65ff00" opacity="0.11200000000000002"/><polygon points="348.50,98.50 506.00,98.50 506.00,98.63 348.63,98.63" fill="#65ff00" opacity="0.21280000000000002"/><polygon points="122.00,98.63 230.00,98.63 230.00,98.75 122.00,98.75" fill="#65ff00" opacity="0.28"/><polygon points="230.00,98.63 348.63,98.63 348.75,98.75 230.00,98.75" fill="#65ff00" opacity="0.22400000000000003"/><polygon points="348.63,98.63 348.62,236.00 348.75,236.00 348.75,98.75" fill="#65ff00" opacity="0.11200000000000002"/><polygon points="348.63,98.63 506.00,98.63 506.00,98.75 348.75,98.75" fill="#65ff00" opacity="0.21280000000000002"/><polygon points="122.00,98.75 230.00,98.75 230.00,98.88 122.00,98.88" fill="#65ff00" opacity="0.28"/><polygon points="230.00,98.75 348.75,98.75 348.88,98.88 230.00,98.88" fill="#65ff00" opacity="0.22400