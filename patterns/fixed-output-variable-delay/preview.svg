<title>Moving-retroreflector delay stage — OpticalSetup setup</title><desc>A native pulsed beam enters a real retroreflector 20 mm above its center and returns on a separate fixed axis 20 mm below. Translating the retroreflector changes the round-trip length. Native retroreflection and pulsed propagation are traced. Carriage mechanics, air-index dispersion and stage accuracy are not simulated.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="-2" y="115" width="497.1" height="186" fill="#ffffff"/><polyline points="132.00,180.00 380.00,180.00 380.00,220.00 219.00,220.00" fill="none" stroke="#8b1a1a" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><g transform="translate(80 180) rotate(0)"><rect x="-46" y="-17" width="92" height="34" rx="4" fill="#3a3f46" stroke="#22252a" stroke-width="1.5"/><text x="0" y="-3"  text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" letter-spacing="1.5" fill="#fff">LASER</text><g stroke="#8fd3ff" stroke-width="1.2" opacity="0.95"><path d="M -17,8 L -12,8 L -10,3 L -8,11 L -6,8 L -1,8"/><path d="M 3,8 L 8,8 L 10,3 L 12,11 L 14,8 L 19,8"/></g><rect x="46" y="-6" width="5" height="12" fill="#666" stroke="#444" stroke-width="1"/></g><text x="80.0" y="212.0" text-anchor="middle"  font-size="11" fill="#444">input</text><g transform="translate(400 200) rotate(0)"><path d="M -50,50 L 0,0 L -50,-50" fill="#e8eaee" fill-opacity="0.3" stroke="#444" stroke-width="3.5"/></g><text x="400.0" y="268.0" text-anchor="middle"  font-size="11" fill="#444">moving-retroreflector</text><g transform="translate(200 220) rotate(180)"><rect x="-18" y="-13" width="36" height="26" rx="3" fill="#4b5563" stroke="#2b333d" stroke-width="1.5"/><text x="0" y="0" transform="rotate(180)" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#fff">PD</text><rect x="-19.5" y="-9" width="3" height="18" fill="#93c5fd" stroke="#2b333d" stroke-width="1"/><circle cx="11" cy="-8" r="3.1" fill="#ff3030" opacity="1" stroke="#fff" stroke-width="0.8"/></g><text x="200.0" y="248.0" text-anchor="middle"  font-size="11" fill="#444">fixed-return</text></svg>
