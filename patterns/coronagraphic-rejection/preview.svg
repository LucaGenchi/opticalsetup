<title>Focal occultation followed by a pupil stop — OpticalSetup setup</title><desc>Two native source directions pass a focusing lens. A small real beam dump intercepts the on-axis focal beam; relay optics and a slit pupil stop feed the final camera. This is the geometrical focal-mask and pupil-stop arrangement. Ray optics cannot predict Lyot diffraction rejection, contrast floor, inner working angle or coherent companion throughput.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="16.54191658702372" y="106.5402021133786" width="1035.4580834129763" height="186.4597978866214" fill="#ffffff"/><polyline points="152.00,200.00 300.00,200.00 390.00,200.00" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="151.80,164.53 300.00,177.50 500.00,240.00 900.00,205.00 978.00,194.28" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><g transform="translate(100 200) rotate(0)"><rect x="-46" y="-17" width="92" height="34" rx="4" fill="#3a3f46" stroke="#22252a" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" letter-spacing="1.2" fill="#fff">CW LASER</text><rect x="46" y="-6" width="5" height="12" fill="#666" stroke="#444" stroke-width="1"/></g><g transform="translate(100 160) rotate(5)"><rect x="-46" y="-17" width="92" height="34" rx="4" fill="#3a3f46" stroke="#22252a" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" letter-spacing="1.2" fill="#fff">CW LASER</text><rect x="46" y="-6" width="5" height="12" fill="#666" stroke="#444" stroke-width="1"/></g><g transform="translate(300 200) rotate(0)"><path d="M 0,-50 Q 9,0 0,50 Q -9,0 0,-50 Z" fill="#c9e4f5" stroke="#4a90c4" stroke-width="1.5"/></g><g transform="translate(400 200) rotate(0)"><path d="M -10,-3 L 10,-3 L 10,3 L -10,3 Z M -10,-3 L 4,0 L -10,3" fill="#26292e" stroke="#111" stroke-width="1.5"/></g><g transform="translate(500 200) rotate(0)"><path d="M 0,-60 Q 9,0 0,60 Q -9,0 0,-60 Z" fill="#c9e4f5" stroke="#4a90c4" stroke-width="1.5"/></g><g transform="translate(700 200) rotate(0)"><rect x="-2.5" y="-60" width="5" height="30" fill="#333"/><rect x="-2.5" y="30" width="5" height="30" fill="#333"/></g><g transform="translate(900 200) rotate(0)"><path d="M 0,-60 Q 9,0 0,60 Q -9,0 0,-60 Z" fill="#c9e4f5" stroke="#4a90c4" stroke-width="1.5"/></g><g transform="translate(1000 200) rotate(0)"><rect x="-20" y="-50" width="40" height="100" rx="3" fill="#4b5563" stroke="#2b333d" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#fff">CAM</text><rect x="-24" y="-42" width="5" height="84" fill="#333" stroke="#2b333d"/><circle cx="13" cy="-43" r="3.1" fill="#65ff00" opacity="1" stroke="#fff" stroke-width="0.8"/></g></svg>
