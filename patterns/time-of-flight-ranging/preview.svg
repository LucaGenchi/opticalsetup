<title>Native pulsed send/return timing bench — OpticalSetup setup</title><desc>A 905 nm pulse is split into a direct reference and a mirror round trip. The reflecting target sits 300 mm from the send/return splitter; a second detector receives the returned pulse. The native tracer carries optical-path pulse delay through a specular mirror return. It does not simulate diffuse lidar targets, a trigger discriminator, time-to-digital conversion, jitter or range estimation.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="-12" y="-18.000000000000004" width="530" height="531" fill="#ffffff"/><polyline points="122.00,160.00 250.00,160.00" fill="none" stroke="#8b1a1a" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="250.00,160.00 250.00,460.00 250.00,160.00" fill="none" stroke="#8b1a1a" stroke-width="2" opacity="0.6499999999999999" stroke-linejoin="round" stroke-linecap="round" /><polyline points="250.00,160.00 116.00,160.00" fill="none" stroke="#8b1a1a" stroke-width="2" opacity="0.5" stroke-linejoin="round" stroke-linecap="round" /><polyline points="250.00,160.00 250.00,67.00" fill="none" stroke="#8b1a1a" stroke-width="2" opacity="0.5" stroke-linejoin="round" stroke-linecap="round" /><polyline points="250.00,160.00 433.00,160.00" fill="none" stroke="#8b1a1a" stroke-width="2" opacity="0.6499999999999999" stroke-linejoin="round" stroke-linecap="round" /><g transform="translate(70 160) rotate(0)"><rect x="-46" y="-17" width="92" height="34" rx="4" fill="#3a3f46" stroke="#22252a" stroke-width="1.5"/><text x="0" y="-3"  text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" letter-spacing="1.5" fill="#fff">LASER</text><g stroke="#8fd3ff" stroke-width="1.2" opacity="0.95"><path d="M -17,8 L -12,8 L -10,3 L -8,11 L -6,8 L -1,8"/><path d="M 3,8 L 8,8 L 10,3 L 12,11 L 14,8 L 19,8"/></g><rect x="46" y="-6" width="5" height="12" fill="#666" stroke="#444" stroke-width="1"/></g><text x="70.0" y="192.0" text-anchor="middle"  font-size="11" fill="#444">pulse</text><g transform="translate(250 160) rotate(90)"><rect x="-12.7" y="-12.7" width="25.4" height="25.4" fill="#c9e4f5" stroke="#4a90c4" stroke-width="1.5"/><line x1="-12.7" y1="12.7" x2="12.7" y2="-12.7" stroke="#4a90c4" stroke-width="1.5"/></g><text x="250.0" y="187.7" text-anchor="middle"  font-size="11" fill="#444">send-return</text><g transform="translate(460 160) rotate(0)"><rect x="-27" y="-15" width="54" height="30" rx="4" fill="#44505d" stroke="#202a33" stroke-width="1.5"/><rect x="-28.7" y="-11" width="3.4" height="22" rx="1" fill="#67e8f9" stroke="#26323c" stroke-width="0.8"/><text x="1" y="1"  text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="720" letter-spacing="0.4" fill="#fff">DET</text><circle cx="19" cy="-8" r="3" fill="#ff3030" opacity="1" stroke="#fff" stroke-width="0.8"/></g><text x="460.0" y="190.0" text-anchor="middle"  font-size="11" fill="#444">reference</text><g transform="translate(250 460) rotate(90)"><line x1="0" y1="-25" x2="0" y2="25" stroke="#444" stroke-width="3.5"/><line x1="-1.5" y1="-25" x2="-7.5" y2="-19" stroke="#888" stroke-width="1"/><line x1="-1.5" y1="-17.666666666666668" x2="-7.5" y2="-11.666666666666668" stroke="#888" stroke-width="1"/><line x1="-1.5" y1="-10.333333333333334" x2="-7.5" y2="-4.333333333333334" stroke="#888" stroke-width="1"/><line x1="-1.5" y1="-3" x2="-7.5" y2="3" stroke="#888" stroke-width="1"/><line x1="-1.5" y1="4.333333333333332" x2="-7.5" y2="10.333333333333332" stroke="#888" stroke-width="1"/><line x1="-1.5" y1="11.666666666666664" x2="-7.5" y2="17.666666666666664" stroke="#888" stroke-width="1"/><line x1="-1.5" y1="19" x2="-7.