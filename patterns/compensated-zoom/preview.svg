<title>Two-group compensated zoom — OpticalSetup setup</title><desc>Two native lens-group endpoints share a fixed 400 mm object-to-image distance: 1× with lens positions 100/300 mm, and 2× with positions 29.289/158.579 mm relative to the object. Native 2D geometrical rays are computed. Diffraction, target-image irradiance and real-lens aberrations are not calculated; ideal object-image markers are separate paraxial constructions. Only two solved endpoints are supplied; continuous motion control, aberration correction and a production zoom prescription are not supplied.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="15.899999999999999" y="58" width="547.1" height="370" fill="#ffffff"/><polyline points="81.00,120.00 180.00,126.92 380.00,127.06 480.00,120.07" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="81.00,120.00 180.00,124.61 380.00,124.70 480.00,120.05" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="81.00,120.00 180.00,122.30 380.00,122.35 480.00,120.02" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="81.00,120.00 180.00,120.00 380.00,120.00 480.00,120.00" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="81.00,120.00 180.00,117.70 380.00,117.65 480.00,119.98" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="81.00,120.00 180.00,115.39 380.00,115.30 480.00,119.95" fill="