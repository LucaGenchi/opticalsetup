<title>Two-color dichroic splitter — OpticalSetup setup</title><desc>Spatially separate 488 and 640 nm native lasers are combined by a first 550 nm dichroic. A second dichroic separates their common beam into two wavelength-selective detector ports. The native dichroic model uses ideal wavelength bands; angle-dependent coating spectra, transition width and leakage are absent.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="-12" y="-2" width="673" height="468" fill="#ffffff"/><polyline points="122.00,200.00 200.00,200.00 350.00,200.00 581.00,200.00" fill="none" stroke="#ff2100" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="200.00,132.00 200.00,200.00 350.00,200.00 350.00,381.00" fill="none" stroke="#00f7ff" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><g transform="translate(70 200) rotate(0)"><rect x="-46" y="-17" width="92" height="34" rx="4" fill="#3a3f46" stroke="#22252a" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" letter-spacing="1.2" fill="#fff">CW LASER</text><rect x="46" y="-6" width="5" height="12" fill="#666" stroke="#444" stroke-width="1"/></g><text x="70.0" y="232.0" text-anchor="middle"  font-size="11" fill="#444">red-input</text><g transform="translate(200 80) rotate(90)"><rect x="-46" y="-17" width="92" height="34" rx="4" fill="#3a3f46" stroke="#22252a" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" letter-spacing="1.2" fill="#fff">CW LASER</text><rect x="46" y="-6" width="5" height="12" fill="#666" stroke="#444" stroke-width="1"/></g><text x="200.0" y="145.0" text-anchor="middle"  font-size="11" fill="#444">blue-input</text><g transform="translate(200 200) rotate(315)"><rect x="-3" y="-20" width="6" height="40" fill="#dfeef7" stroke="#5d7f96" stroke-width="1.5"/><line x1="-3" y1="-20" x2="-3" y2="20" stroke="#b04ad0" stroke-width="2"/></g><text x="200.0" y="234.2" text-anchor="middle"  font-size="11" fill="#444">input-combiner</text><g transform="translate(350 200) rotate(315)"><rect x="-3" y="-20" width="6" height="40" fill="#dfeef7" stroke="#5d7f96" stroke-width="1.5"/><line x1="-3" y1="-20" x2="-3" y2="20" stroke="#b04ad0" stroke-width="2"/></g><text x="350.0" y="234.2" text-anchor="middle"  font-size="11" fill="#444">dichroic</text><g transform="translate(600 200) rotate(0)"><rect x="-18" y="-13" width="36" height="26" rx="3" fill="#4b5563" stroke="#2b333d" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#fff">PD</text><rect x="-19.5" y="-9" width="3" height="18" fill="#93c5fd" stroke="#2b333d" stroke-width="1"/><circle cx="11" cy="-8" r="3.1" fill="#ff2100" opacity="1" stroke="#fff" stroke-width="0.8"/></g><text x="600.0" y="228.0" text-anchor="middle"  font-size="11" fill="#444">red-output</text><g transform="translate(350 400) rotate(90)"><rect x="-18" y="-13" width="36" height="26" rx="3" fill="#4b5563" stroke="#2b333d" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#fff">PD</text><rect x="-19.5" y="-9" width="3" height="18" fill="#93c5fd" stroke="#2b333d" stroke-width="1"/><circle cx="11" cy="-8" r="3.1" fill="#00f7ff" opacity="1" stroke="#fff" stroke-width="0.8"/></g><text x="350.0" y="433.0" text-anchor="middle"  font-size="11" fill="#444">blue-output</text></svg>
