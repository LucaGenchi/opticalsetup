<title>Native sample/reference transmission bench — OpticalSetup setup</title><desc>A 50:50 splitter sends one branch through a 60%-transmitting sample and the other to a reference detector. Native power meters report both channels for manual normalization. The native optical branches and absolute powers from the configured source are traced. Ratio computation is manual; detector noise, dark subtraction, electronics gain, drift and uncertainty propagation are not simulated.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="-12" y="51" width="649.2" height="300" fill="#ffffff"/><polygon points="122.00,98.50 258.50,98.50 258.63,98.63 122.00,98.63" fill="#65ff00" opacity="0.28"/><polygon points="258.50,98.50 258.50,256.00 258.62,256.00 258.63,98.63" fill="#65ff00" opacity="0.14"/><polygon points="258.50,98.50 400.00,98.50 400.00,98.63 258.63,98.63" fill="#65ff00" opacity="0.14"/><polygon points="400.00,98.50 546.00,98.50 546.00,98.63 400.00,98.63" fill="#65ff00" opacity="0.11200000000000002"/><polygon points="122.00,98.63 258.63,98.63 258.75,98.75 122.00,98.75" fill="#65ff00" opacity="0.28"/><polygon points="258.63,98.63 258.62,256.00 258.75,256.00 258.75,98.75" fill="#65ff00" opacity="0.14"/><polygon points="258.63,98.63 400.00,98.63 400.00,98.75 258.75,98.75" fill="#65ff00" opacity="0.14"/><polygon points="400.00,98.63 546.00,98.63 546.00,98.75 400.00,98.75" fill="#65ff00" opacity="0.11200000000000002"/><polygon points="122.00,98.75 258.75,98.75 258.88,98.88 122.00,98.88" fill="#65ff00" opacity="0.28"/><polygon points="258.75,98.75 258.75,256.00 258.87,256.00 258.88,98.88" fill="#65ff00" opacity="0.14"/><polygon points="258.75,98.75 400.00,98.75 400.00,98.88 258.88,98.