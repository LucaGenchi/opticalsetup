<title>Two serial native 1:1 image relays — OpticalSetup setup</title><desc>A native luminous object at 100 mm feeds two 4f relays built from four 50 mm thin lenses. The intermediate image lies at 300 mm and the final camera at 500 mm. Paraxial 2D object rays and relay imaging are shown. This is a lens-built serial relay, not a commercial rod-lens prescription or a calibrated rigid-endoscope aberration model.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="60" y="128" width="492" height="144" fill="#ffffff"/><polyline points="101.00,200.00 150.00,204.29 250.00,204.46 350.00,195.71 450.00,195.54 478.00,197.99" fill="none" stroke="#ff7700" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="101.00,200.00 150.00,200.00 250.00,200.00 350.00,200.00 450.00,200.00 478.00,200.00" fill="none" stroke="#ff7700" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="101.00,200.00 150.00,195.71 250.00,195.54 350.00,204.29 450.00,204.46 478.00,202.01" fill="none" stroke="#ff7700" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="500.00,205.00 500.00,197.80" fill="none" stroke="#ff7700" stroke-width="2.2" opacity="0.85" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/><polygon points="500.00,195.00 498.30,198.40 501.70,198.40" fill="#ff7700" opacity="0.85"/><g transform="translate(100 200) rotate(0)"><line x1="-7" y1="0" x2="7" y2="0" stroke="#888" stroke-width="1.2"/><polyline points="0.0,5.0 0.0,-2.2" fill="none" stroke="#ff7700" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polygon points="0.0,-5.0 -1.7,-1.6 1.7,-1.6" fill="#ff7700"/></g><g transform="translate(150 200) rotate(0)"><path d="M 0,-15 Q 9,0 0,15 Q -9,0 0,-15 Z" fill="#c9e4f5" stroke="#4a90c4" stroke-width="1.5"/></g><g transform="translate(250 200) rotate(0)"><path d="M 0,-15 Q 9,0 0,15 Q -9,0 0,-15 Z" fill="#c9e4f5" stroke="#4a90c4" stroke-width="1.5"/></g><g transform="translate(350 200) rotate(0)"><path d="M 0,-15 Q 9,0 0,15 Q -9,0 0,-15 Z" fill="#c9e4f5" stroke="#4a90c4" stroke-width="1.5"/></g><g transform="translate(450 200) rotate(0)"><path d="M 0,-15 Q 9,0 0,15 Q -9,0 0,-15 Z" fill="#c9e4f5" stroke="#4a90c4" stroke-width="1.5"/></g><g transform="translate(500 200) rotate(0)"><rect x="-20" y="-40" width="40" height="80" rx="3" fill="#4b5563" stroke="#2b333d" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#fff">CAM</text><rect x="-24" y="-32" width="5" height="64" fill="#333" stroke="#2b333d"/><circle cx="13" cy="-33" r="3.1" fill="#ff7700" opacity="1" stroke="#fff" stroke-width="0.8"/></g></svg>
