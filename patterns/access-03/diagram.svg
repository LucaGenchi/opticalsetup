     SPDX-License-Identifier: GPL-3.0-or-later -->
<title id="access-03-title">Proximally scanned confocal image bundle</title><desc id="access-03-desc">A 488 nm spot scans across the proximal bundle face. The addressed distal core illuminates one tissue location; the same core carries the fluorescence back to a conjugate pinhole detector. Arrows indicate connections, not calculated ray trajectories.</desc>
<defs><marker id="access-03-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#78dfb0" stroke-width="1.5"/></marker><marker id="access-03-reference" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#efbe71" stroke-width="1.5"/></marker><marker id="access-03-signal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#a6b9db" stroke-width="1.5"/></marker><pattern id="access-03-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#34465a"/></pattern></defs>
<rect width="960" height="440" fill="#101e2b"/><rect width="960" height="440" fill="url(#access-03-grid)"/>
<g fill="none" stroke-width="2"><path d="M130,85L245,85" stroke="#78dfb0" marker-end="url(#access-03-light)"><title>excitation</title></path><path d="M325,85L440,85" stroke="#78dfb0" marker-end="url(#access-03-light)"><title>shared excitation</title></path><path d="M513.9199321602035,106.19995760012719L646.0800678397965,188.8000423998728" stroke="#78dfb0" marker-end="url(#access-03-light)"><title>selected core</title></path><path d="M720,210L835,210" stroke="#78dfb0" marker-end="url(#access-03-light)"><title>distal spot</title></path><path d="M835,210L720,210" stroke="#78dfb0" marker-end="url(#access-03-light)"><title>fluorescence return</title></path><path d="M646.0800678397965,188.8000423998728L513.9199321602035,106.19995760012719" stroke="#78dfb0" marker-end="url(#access-03-light)"><title>proximal return</title></path><path d="M440,85L325,85" stroke="#78dfb0" marker-end="url(#access-03-light)"><title>descanned return</title></path><path d="M309.6012719477551,116.54009224071164L455.3987280522449,303.45990775928834" stroke="#78dfb0" marker-end="url(#access-03-light)"><title>descanned signal</title></path><path d="M440,335L325,335" stroke="#78dfb0" marker-end="url(#access-03-light)"><title>confocal signal</title></path></g>
<g transform="translate(90,85)">
<title>488 nm excitation: Feeds a proximally located scan system.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(0.46153846153846156) rotate(0)"><rect x="-46" y="-17" width="92" height="34" rx="4" fill="#3a3f46" stroke="#22252a" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" letter-spacing="1.2" fill="#fff">CW LASER</text><rect x="46" y="-4.5" width="5" height="9" fill="#666" stroke="#444" stroke-width="1"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">1</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">488 nm excitation</tspan></text></g><g transform="translate(480,85)">
<title>Proximal scanner: Selects bundle cores without moving distal hardware.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(1) rotate(0)"><circle r="4.5" fill="#777" stroke="#444" stroke-width="1.2"/><g transform="rotate(0)"><line x1="0" y1="-10" x2="0" y2="10" stroke="#444" stroke-width="3"/></g><path d="M -9,-13 A 15 15 0 0 1 9,-13" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="3 2"/><path d="M -9,13 A 15 15 0 0 0 9,13" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="3 2"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">2</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Proximal scanner</tspan></text></g><g transform="translate(285,85)">
<title>Return pickoff: Separates return fluorescence from excitation.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(1) rotate(0)"><rect x="-3" y="-12.7" width="6" height="25.4" fill="#dfeef7" stroke="#5d7f96" stroke-width="1.5"/><line x1="-3" y1="-12.7" x2="-3" y2="12.7" stroke="#b04ad0" stroke-width="2"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">3</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Return pickoff</tspan></text></g><g transform="translate(680,210)">
<title>Coherent bundle: Maintains correspondence between addressed cores and distal positions.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><path d="M-13 0H13M0-13V13" stroke="#587088" stroke-width="1.5"/>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">4</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Coherent bundle</tspan></text></g><g transform="translate(875,210)">
<title>Distal tissue: One selected core illuminates its mapped region.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(0.8571428571428571) rotate(0)"><rect x="-25" y="-3.00" width="50" height="6" fill="#c9e4f5" stroke="none"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">5</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Distal tissue</tspan></text></g><g transform="translate(480,335)">
<title>Conjugate pinhole: Selects the descanned proximal return.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(0.8450704225352114) rotate(0)"><rect x="-2.5" y="-25.4" width="5" height="21.4" fill="#333"/><rect x="-2.5" y="4" width="5" height="21.4" fill="#333"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">6</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Conjugate pinhole</tspan></text></g><g transform="translate(285,335)">
<title>Confocal detector: Raster timing assigns signal to each addressed location.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(0.8888888888888888) rotate(0)"><rect x="-25" y="-13" width="50" height="26" rx="13" fill="#4b5563" stroke="#2b333d" stroke-width="1.5"/><rect x="-27" y="-9" width="4" height="18" fill="#93c5fd" stroke="#2b333d" stroke-width="1"/><text x="2" y="0"  text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#fff">PMT</text><circle cx="16" cy="-7" r="3.1" fill="#88919b" opacity="0.45" stroke="#fff" stroke-width="0.8"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">7</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Confocal detector</tspan></text></g>
<g font-family="Arial,sans-serif" font-size="12" fill="#b3c5d4"><path d="M30 418H56" stroke="#78dfb0" stroke-width="2"/><text x="64" y="422">Optical path</text><path d="M188 418H214" stroke="#efbe71" stroke-width="2"/><text x="222" y="422">Reference / auxiliary</text><path d="M402 418H428" stroke="#a6b9db" stroke-width="2" stroke-dasharray="5 4"/><text x="436" y="422">Signal / control</text><text x="930" y="422" text-anchor="end">Arrangement map · not to scale</text></g>
</svg>
