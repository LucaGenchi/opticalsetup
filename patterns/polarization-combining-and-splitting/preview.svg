<title>Equal-power polarization splitter — OpticalSetup setup</title><desc>A 532 nm beam with linear polarization at 45° enters a PBS and divides into orthogonal polarization channels. Ideal Stokes projection is traced; finite PBS extinction, coating phase and depolarization are absent.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="-2" y="151" width="666.1" height="315" fill="#ffffff"/><polyline points="132.00,200.00 350.00,200.00" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="350.00,200.00 350.00,381.00" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.6499999999999999" stroke-linejoin="round" stroke-linecap="round" /><polyline points="350.00,200.00 581.00,200.00" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.6499999999999999" stroke-linejoin="round" stroke-linecap="round" /><g transform="translate(80 200) rotate(0)"><rect x="-46" y="-17" width="92" height="34" rx="4" fill="#3a3f46" stroke="#22252a" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" letter-spacing="1.2" fill="#fff">CW LASER</text><rect x="46" y="-6" width="5" height="12" fill="#666" stroke="#444" stroke-width="1"/></g><text x="80.0" y="232.0" text-anchor="middle"  font-size="11" fill="#444">input</text><g transform="translate(350 200) rotate(90)"><rect x="-12.7" y="-12.7" width="25.4" height="25.4" fill="#d5e3f0" stroke="#3f6a92" stroke-width="1.6"/><line x1="-12.7" y1="12.7" x2="12.7" y2="-12.7" stroke="#3f6a92" stroke-width="1.6"/><text x="-12.7" y="20.7" text-anchor="start" dominant-baseline="central" font-size="8.5" fill="#3f6a92" font-weight="600" >PBS</text></g><text x="350.0" y="227.7" text-anchor="middle"  font-size="11" fill="#444">splitter</text><g transform="translate(600 200) rotate(0)"><rect x="-18" y="-13" width="36" height="26" rx="3" fill="#4b5563" stroke="#2b333d" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#fff">PD</text><rect x="-19.5" y="-9" width="3" height="18" fill="#93c5fd" stroke="#2b333d" stroke-width="1"/><circle cx="11" cy="-8" r="3.1" fill="#65ff00" opacity="1" stroke="#fff" stroke-width="0.8"/></g><text x="600.0" y="228.0" text-anchor="middle"  font-size="11" fill="#444">transmitted</text><g transform="translate(350 400) rotate(90)"><rect x="-18" y="-13" width="36" height="26" rx="3" fill="#4b5563" stroke="#2b333d" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#fff">PD</text><rect x="-19.5" y="-9" width="3" height="18" fill="#93c5fd" stroke="#2b333d" stroke-width="1"/><circle cx="11" cy="-8" r="3.1" fill="#65ff00" opacity="1" stroke="#fff" stroke-width="0.8"/></g><text x="350.0" y="433.0" text-anchor="middle"  font-size="11" fill="#444">reflected</text></svg>
