<title>Fluorescence return through a conjugate detection slit — OpticalSetup setup</title><desc>A native 488 nm source is focused onto a fluorescent specimen. Returning longer-wavelength light is reflected into a collection lens, a conjugate slit and a photodetector. The 2D slit is the available detection-aperture implementation. Traced collection and clipping are shown; an Airy-unit pinhole, axial point-spread function and 3D optical sectioning are not calculated.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="-152" y="137" width="789" height="463" fill="#ffffff"/><polyline points="132.00,200.00 250.00,200.00 420.00,200.00 450.00,200.00" fill="none" stroke="#00f7ff" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="450.00,200.00 454.15,199.62" fill="none" stroke="#00ff28" stroke-width="1.8" opacity="0.32965660770031224" stroke-linejoin="round" stroke-linecap="round" /><polyline points="454.15,199.62 458.30,199.24" fill="none" stroke="#00ff28" stroke-width="1.8" opacity="0.15644444444444447" stroke-linejoin="round" stroke-linecap="round" /><polyline points="458.30,199.24 462.45,198.85" fill="none" stroke="#00ff28" stroke-width="1.8" opacity="0.09100833093938528" stroke-linejoin="round" stroke-linecap="round" /><polyline points="462.45,198.85 466.60,198.47" fill="none" stroke="#00ff28" stroke-width="1.8" opacity="0.05944830174516796" stroke-linejoin="round" stroke-linecap="round" /><polyline points="466.60,198.47 470.75,198.09" fill="none" stroke="#00ff28" stroke-width="1.8" opacity="0.04185493460166469" stroke-linejoin="round" stroke-linecap="round" /><polyline points="470.75,198.09 474.89,197.71" fill="none" stroke=