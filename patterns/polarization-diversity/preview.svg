<title>Dual-polarization coherent receiver — OpticalSetup setup</title><desc>A real PBS separates a 45° 1550 nm signal into H and V channels. Each is mixed with a separately represented local-oscillator feed in its own native 50/50 splitter and collected at two ports. This native scene is the polarization-diverse optical mixing front end. It does not implement a four-phase telecom hybrid, balanced RF electronics, data recovery or shared-LO phase locking.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="-2" y="-2" width="678.8" height="742" fill="#ffffff"/><polyline points="132.00,200.00 250.00,200.00" fill="none" stroke="#6e3b3b" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="250.00,200.00 250.00,500.00 400.00,500.00" fill="none" stroke="#6e3b3b" stroke-width="2" opacity="0.6499999999999999" stroke-linejoin="round" stroke-linecap="round" /><polyline points="400.00,500.00 400.00,650.00" fill="none" stroke="#6e3b3b" stroke-width="2" opacity="0.5" stroke-linejoin="round" stroke-linecap="round" /><polyline points="400.00,500.00 600.00,500.00" fill="none" stroke="#6e3b3b" stroke-width="2" opacity="0.5" stroke-linejoin="round" stroke-linecap="round" /><polyline points="250.00,200.00 400.00,200.00" fill="none" stroke="#6e3b3b" stroke-width="2" opacity="0.6499999999999999" stroke-linejoin="round" stroke-linecap="round" /><polyline points="400.00,200.00 400.00,278.00" fill="none" stroke="#6e3b3b" stroke-width="2" opacity="0.5" stroke-linejoin="round" stroke-linecap="round" /><polyline points="400.00,200.00 600.00,200.00" fill="none" stroke="#6e3b3b" stroke-width="2" opacity="0.5" stroke-linejoin="round" stroke-linecap="round