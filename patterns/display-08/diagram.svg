<title id="display-08-title">Edge-lit guide with graded extraction</title><desc id="display-08-desc">A blue LED injects into a rectangular guide; three progressively stronger extraction zones illuminate a diffuser while a terminal reflector returns residual power. Arrows indicate connections, not calculated ray trajectories.</desc>
<defs><marker id="display-08-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#78dfb0" stroke-width="1.5"/></marker><marker id="display-08-reference" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#efbe71" stroke-width="1.5"/></marker><marker id="display-08-signal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#a6b9db" stroke-width="1.5"/></marker><pattern id="display-08-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#34465a"/></pattern></defs>
<rect width="960" height="440" fill="#101e2b"/><rect width="960" height="440" fill="url(#display-08-grid)"/>
<g fill="none" stroke-width="2"><path d="M120,210L210,210" stroke="#78dfb0" marker-end="url(#display-08-light)"><title>input</title></path><path d="M290,210L380,210" stroke="#78dfb0" marker-end="url(#display-08-light)"><title>guided feed</title></path><path d="M460,210L550,210" stroke="#78dfb0" marker-end="url(#display-08-light)"><title>remaining power</title></path><path d="M630,210L730,210" stroke="#78dfb0" marker-end="url(#display-08-light)"><title>remaining power</title></path><path d="M732.8609323645896,224.85562705416416L457.13906763541036,335.14437294583587" stroke="#78dfb0" marker-end="url(#display-08-light)"><title>residual</title></path><path d="M420,335.1L420,320L590,320L590,250" stroke="#78dfb0" marker-end="url(#display-08-light)"><title>recycled light</title></path><path d="M389.122790575318,184.571709885556L280.877209424682,95.42829011444398" stroke="#78dfb0" marker-end="url(#display-08-light)"><title>extraction</title></path><path d="M553.0128760610114,194.7700077898282L286.98712393898865,85.22999221017179" stroke="#78dfb0" marker-end="url(#display-08-light)"><title>extraction</title></path><path d="M731.3753696591732,199.6010610620851L288.6246303408268,80.3989389379149" stroke="#78dfb0" marker-end="url(#display-08-light)"><title>extraction</title></path></g>
<g transform="translate(80,210)">
<title>450 nm edge source: Proposed blue source along one panel edge.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(1) rotate(0)"><g transform="scale(1)"><circle r="4.5" fill="#65ff00" stroke="#333" stroke-width="1"/><line x1="6.0" y1="0.0" x2="11.0" y2="0.0" stroke="#65ff00" stroke-width="1.6" stroke-linecap="round"/><line x1="4.2" y1="4.2" x2="7.8" y2="7.8" stroke="#65ff00" stroke-width="1.6" stroke-linecap="round"/><line x1="0.0" y1="6.0" x2="0.0" y2="11.0" stroke="#65ff00" stroke-width="1.6" stroke-linecap="round"/><line x1="-4.2" y1="4.2" x2="-7.8" y2="7.8" stroke="#65ff00" stroke-width="1.6" stroke-linecap="round"/><line x1="-6.0" y1="0.0" x2="-11.0" y2="0.0" stroke="#65ff00" stroke-width="1.6" stroke-linecap="round"/><line x1="-4.2" y1="-4.2" x2="-7.8" y2="-7.8" stroke="#65ff00" stroke-width="1.6" stroke-linecap="round"/><line x1="-0.0" y1="-6.0" x2="-0.0" y2="-11.0" stroke="#65ff00" stroke-width="1.6" stroke-linecap="round"/><line x1="4.2" y1="-4.2" x2="7.8" y2="-7.8" stroke="#65ff00" stroke-width="1.6" stroke-linecap="round"/></g></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">1</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">450 nm edge source</tspan></text></g><g transform="translate(250,210)">
<title>Input mixer: Reduce input hot spots before guide distribution.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(1) rotate(0)"><rect x="-3" y="-12.7" width="6" height="25.4" fill="#eceef1" stroke="#6b7280" stroke-width="1.3"/><path d="M -3,-12.7 L -3.4,-11.2 L -3.4,-8.2 L -3.4,-5.199999999999999 L -3.4,-2.1999999999999993 L -3.4,0.8000000000000007 L -3.4,3.8000000000000007 L -3.4,6.800000000000001 L -3.4,9.8 L -3.4,12.8 L -3,12.7" fill="none" stroke="#6b7280" stroke-width="1"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">2</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Input mixer</tspan></text></g><g transform="translate(420,210)">
<title>Sparse extraction: Low extraction near the illuminated edge.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><path d="M-13 0H13M0-13V13" stroke="#587088" stroke-width="1.5"/>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">3</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Sparse extraction</tspan></text></g><g transform="translate(590,210)">
<title>Medium extraction: Higher density farther from the source.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><path d="M-13 0H13M0-13V13" stroke="#587088" stroke-width="1.5"/>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">4</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Medium extraction</tspan></text></g><g transform="translate(770,210)">
<title>Dense extraction: Strong extraction near the remote edge.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><path d="M-13 0H13M0-13V13" stroke="#587088" stroke-width="1.5"/>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">5</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Dense extraction</tspan></text></g><g transform="translate(250,70)">
<title>Output diffuser: Blend spatial extraction into panel illumination.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(1) rotate(0)"><rect x="-3" y="-12.7" width="6" height="25.4" fill="#eceef1" stroke="#6b7280" stroke-width="1.3"/><path d="M -3,-12.7 L -3.4,-11.2 L -3.4,-8.2 L -3.4,-5.199999999999999 L -3.4,-2.1999999999999993 L -3.4,0.8000000000000007 L -3.4,3.8000000000000007 L -3.4,6.800000000000001 L -3.4,9.8 L -3.4,12.8 L -3,12.7" fill="none" stroke="#6b7280" stroke-width="1"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">6</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Output diffuser</tspan></text></g><g transform="translate(420,350)">
<title>End reflector: Recycle residual guided power.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(1) rotate(0)"><line x1="0" y1="-12.7" x2="0" y2="12.7" stroke="#444" stroke-width="3.5"/><line x1="-1.5" y1="-12.7" x2="-7.5" y2="-6.699999999999999" stroke="#888" stroke-width="1"/><line x1="-1.5" y1="-6.233333333333333" x2="-7.5" y2="-0.2333333333333334" stroke="#888" stroke-width="1"/><line x1="-1.5" y1="0.2333333333333325" x2="-7.5" y2="6.2333333333333325" stroke="#888" stroke-width="1"/><line x1="-1.5" y1="6.699999999999999" x2="-7.5" y2="12.7" stroke="#888" stroke-width="1"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">7</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">End reflector</tspan></text></g>
<g font-family="Arial,sans-serif" font-size="12" fill="#b3c5d4"><path d="M30 418H56" stroke="#78dfb0" stroke-width="2"/><text x="64" y="422">Optical path</text><path d="M188 418H214" stroke="#efbe71" stroke-width="2"/><text x="222" y="422">Reference / auxiliary</text><path d="M402 418H428" stroke="#a6b9db" stroke-width="2" stroke-dasharray="5 4"/><text x="436" y="422">Signal / control</text><text x="930" y="422" text-anchor="end">Arrangement map · not to scale</text></g>
</svg>
