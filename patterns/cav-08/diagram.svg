<title id="cav-08-title">Dispersion-managed mode-locked ring oscillator</title><desc id="cav-08-desc">An illustrative 80 MHz ring includes a pumped gain segment, fast saturable loss, negative-dispersion mirrors and a small output coupler. Total group delay, not diagram length, fixes the repetition rate. Arrows indicate connections, not calculated ray trajectories.</desc>
<defs><marker id="cav-08-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#78dfb0" stroke-width="1.5"/></marker><marker id="cav-08-reference" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#efbe71" stroke-width="1.5"/></marker><marker id="cav-08-signal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#a6b9db" stroke-width="1.5"/></marker><pattern id="cav-08-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#34465a"/></pattern></defs>
<rect width="960" height="440" fill="#101e2b"/><rect width="960" height="440" fill="url(#cav-08-grid)"/>
<g fill="none" stroke-width="2"><path d="M90,270L90,125" stroke="#78dfb0" marker-end="url(#cav-08-light)"><title>pump energy</title></path><path d="M130,85L245,85" stroke="#78dfb0" marker-end="url(#cav-08-light)"><title>circulation</title></path><path d="M325,85L440,85" stroke="#78dfb0" marker-end="url(#cav-08-light)"><title>pulse selection</title></path><path d="M520,85L640,85" stroke="#78dfb0" marker-end="url(#cav-08-light)"><title>compensated field</title></path><path d="M653.4254464468032,114.89637274734639L506.5745535531968,280.1036272526536" stroke="#78dfb0" marker-end="url(#cav-08-light)"><title>retained field</title></path><path d="M445.352576558056,290.0111018604169L124.64742344194403,104.98889813958309" stroke="#78dfb0" marker-end="url(#cav-08-light)"><title>round trip</title></path><path d="M720,85L835,85" stroke="#78dfb0" marker-end="url(#cav-08-light)"><title>output train</title></path></g>
<g transform="translate(90,85)">
<title>Pumped gain segment: Balances round-trip loss.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(1) rotate(0)"><path d="M -12,-11 L 16,-11 L 12,11 L -16,11 Z" fill="#e4d5f2" stroke="#8a5fb0" stroke-width="1.5"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">1</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Pumped gain segment</tspan></text></g><g transform="translate(285,85)">
<title>Saturable loss: Favors short high-intensity pulses over weak background.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><path d="M-13 0H13M0-13V13" stroke="#587088" stroke-width="1.5"/>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">2</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Saturable loss</tspan></text></g><g transform="translate(480,85)">
<title>Dispersion mirrors: Balance accumulated group-delay dispersion.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(0.9230769230769231) rotate(0)"><rect x="-24" y="-15" width="48" height="30" rx="4" fill="#eee4fb" stroke="#70479c" stroke-width="1.5"/><g  fill="none" stroke="#70479c" stroke-width="1.5" stroke-linecap="round"><path d="M -17,-7 C -8,-7 -7,-2 0,-2 C 7,-2 8,-7 17,-7"/><path d="M -17,7 C -8,7 -7,2 0,2 C 7,2 8,7 17,7"/></g><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="8" font-weight="750" fill="#4f2e73">−GDD</text></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">3</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Dispersion mirrors</tspan></text></g><g transform="translate(680,85)">
<title>Output coupler: Extracts a small fraction of each circulation.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(1) rotate(0)"><line x1="0" y1="-12.7" x2="0" y2="12.7" stroke="#444" stroke-width="3.5"/><line x1="-1.5" y1="-12.7" x2="-7.5" y2="-6.699999999999999" stroke="#888" stroke-width="1"/><line x1="-1.5" y1="-6.233333333333333" x2="-7.5" y2="-0.2333333333333334" stroke="#888" stroke-width="1"/><line x1="-1.5" y1="0.2333333333333325" x2="-7.5" y2="6.2333333333333325" stroke="#888" stroke-width="1"/><line x1="-1.5" y1="6.699999999999999" x2="-7.5" y2="12.7" stroke="#888" stroke-width="1"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">4</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Output coupler</tspan></text></g><g transform="translate(875,85)">
<title>80 MHz pulse train: Nominal separation is 12.5 ns.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(0.46153846153846156) rotate(0)"><rect x="-46" y="-17" width="92" height="34" rx="4" fill="#3a3f46" stroke="#22252a" stroke-width="1.5"/><text x="0" y="-3"  text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" letter-spacing="1.5" fill="#fff">LASER</text><g stroke="#8fd3ff" stroke-width="1.2" opacity="0.95"><path d="M -17,8 L -12,8 L -10,3 L -8,11 L -6,8 L -1,8"/><path d="M 3,8 L 8,8 L 10,3 L 12,11 L 14,8 L 19,8"/></g><rect x="46" y="-4.5" width="5" height="9" fill="#666" stroke="#444" stroke-width="1"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">5</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">80 MHz pulse train</tspan></text></g><g transform="translate(480,310)">
<title>Ring return optics: Close the resonator without resetting the pulse state.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(1) rotate(0)"><line x1="0" y1="-12.7" x2="0" y2="12.7" stroke="#444" stroke-width="3.5"/><line x1="-1.5" y1="-12.7" x2="-7.5" y2="-6.699999999999999" stroke="#888" stroke-width="1"/><line x1="-1.5" y1="-6.233333333333333" x2="-7.5" y2="-0.2333333333333334" stroke="#888" stroke-width="1"/><line x1="-1.5" y1="0.2333333333333325" x2="-7.5" y2="6.2333333333333325" stroke="#888" stroke-width="1"/><line x1="-1.5" y1="6.699999999999999" x2="-7.5" y2="12.7" stroke="#888" stroke-width="1"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">6</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Ring return optics</tspan></text></g><g transform="translate(90,310)">
<title>Pump input: Supplies gain energy independently of output pulses.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><path d="M-13 0H13M0-13V13" stroke="#587088" stroke-width="1.5"/>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">7</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Pump input</tspan></text></g>
<g font-family="Arial,sans-serif" font-size="12" fill="#b3c5d4"><path d="M30 418H56" stroke="#78dfb0" stroke-width="2"/><text x="64" y="422">Optical path</text><path d="M188 418H214" stroke="#efbe71" stroke-width="2"/><text x="222" y="422">Reference / auxiliary</text><path d="M402 418H428" stroke="#a6b9db" stroke-width="2" stroke-dasharray="5 4"/><text x="436" y="422">Signal / control</text><text x="930" y="422" text-anchor="end">Arrangement map · not to scale</text></g>
</svg>
