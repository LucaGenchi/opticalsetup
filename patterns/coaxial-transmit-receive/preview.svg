<title>Native polarization-separated common-aperture return — OpticalSetup setup</title><desc>A 905 nm beam crosses a PBS, a quarter-wave plate and one shared lens before reflecting from a specular target. Its double-pass polarization directs the return into a separate detector. This native common-aperture geometry computes ideal polarization routing and a specular mirror return. Diffuse-target depolarization, telescope throughput, lidar range estimation and receiver electronics are not modeled.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="-12" y="-10.000000000000004" width="530.6" height="235" fill="#ffffff"/><polyline points="122.00,160.00 250.00,160.00" fill="none" stroke="#8b1a1a" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="250.00,160.00 325.00,160.00" fill="none" stroke="#8b1a1a" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="325.00,160.00 380.00,160.00 470.00,160.00 380.00,160.00 325.00,160.00" fill="none" stroke="#8b1a1a" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="325.00,160.00 250.00,160.00" fill="none" stroke="#8b1a1a" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="250.00,160.00 250.00,59.00" fill="none" stroke="#8b1a1a" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><g transform="translate(70 160) rotate(0)"><rect x="-46" y="-17" width="92" height="34" rx="4" fill="#3a3f46" stroke="#22252a" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" letter-spacing="1.2" fill="#fff">CW LASER</text><rect x="46" y="-6" width="5" height="12" fill="#666" stroke="#444" stroke-width="1"/></g><text x="70.0" y="192.0" text-anchor="middle"  font-size="11" fill="#444">transmit</text><g transform="translate(250 160) rotate(90)"><rect x="-12.7" y="-12.7" width="25.4" height="25.4" fill="#d5e3f0" stroke="#3f6a92" stroke-width="1.6"/><line x1="-12.7" y1="12.7" x2="12.7" y2="-12.7" stroke="#3f6a92" stroke-width="1.6"/><text x="-12.7" y="20.7" text-anchor="start" dominant-baseline="central" font-size="8.5" fill="#3f6a92" font-weight="600" >PBS</text></g><text x="250.0" y="187.7" text-anchor="middle"  font-size="11" fill="#444">separator</text><g transform="translate(325 160) rotate(0)"><rect x="-2.5" y="-12.7" width="5" height="25.4" fill="#e8d5ef" stroke="#8a5fa8" stroke-width="1.4"/><text x="0" y="-18.7" text-anchor="middle" dominant-baseline="central" font-size="8.5" fill="#6a4a80" >λ/4</text></g><text x="325.0" y="188.7" text-anchor="middle"  font-size="11" fill="#444">QWP</text><g transform="translate(380 160) rotate(0)"><path d="M 0,-15 Q 9,0 0,15 Q -9,0 0,-15 Z" fill="#c9e4f5" stroke="#4a90c4" stroke-width="1.5"/></g><text x="380.0" y="191.0" text-anchor="middle"  font-size="11" fill="#444">Lens</text><g transform="translate(470 160) rotate(0)"><line x1="0" y1="-12.7" x2="0" y2="12.7" stroke="#444" stroke-width="3.5"/><line x1="-1.5" y1="-12.7" x2="-7.5" y2="-6.699999999999999" stroke="#888" stroke-width="1"/><line x1="-1.5" y1="-6.233333333333333" x2="-7.5" y2="-0.2333333333333334" stroke="#888" stroke-width="1"/><line x1="-1.5" y1="0.2333333333333325" x2="-7.5" y2="6.2333333333333325" stroke="#888" stroke-width="1"/><line x1="-1.5" y1="6.699999999999999" x2="-7.5" y2="12.7" stroke="#888" stroke-width="1"/></g><text x="470.0" y="188.7" text-anchor="middle"  font-size="11" fill="#444">target</text><g transform="translate(250 40) rotate(270)"><rect x="-18" y="-13" width="36" height="26" rx="3" fill="#4b5563" stroke="#2b3