<title>Infrared pupil-aperture matching with a native relay — OpticalSetup setup</title><desc>A native 4 µm source illuminates an entrance aperture that is reimaged through two lenses onto a second matched slit. A downstream camera shows admitted and clipped rays. The setup provides native pupil geometry and clipping. Stop temperature, thermal emission, cryogenic optics and background noise are not modeled; the lens proxy is geometric rather than an infrared material prescription.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="18" y="118" width="884" height="164" fill="#ffffff"/><polygon points="152.00,194.00 250.00,194.00 250.00,194.50 152.00,194.50" fill="#6e3b3b" opacity="0.28"/><polygon points="152.00,194.50 250.00,194.50 250.00,195.00 152.00,195.00" fill="#6e3b3b" opacity="0.28"/><polygon points="152.00,195.00 250.00,195.00 250.00,195.50 152.00,195.50" fill="#6e3b3b" opacity="0.28"/><polygon points="152.00,195.50 350.00,195.50 350.00,196.00 152.00,196.00" fill="#6e3b3b" opacity="0.28"/><polygon points="350.00,195.50 550.00,204.50 550.00,204.00 350.00,196.00" fill="#6e3b3b" opacity="0.28"/><polygon points="550.00,204.50 828.00,204.50 828.00,204.00 550.00,204.00" fill="#6e3b3b" opacity="0.28"/><polygon points="152.00,196.00 350.00,196.00 350.00,196.50 152.00,196.50" fill="#6e3b3b" opacity="0.28"/><polygon points="350.00,196.00 550.00,204.00 550.00,203.50 350.00,196.50" fill="#6e3b3b" opacity="0.28"/><polygon points="550.00,204.00 828.00,204.00 828.00,203.50 550.00,203.50" fill="#6e3b3b" opacity="0.28"/><polygon points="152.00,196.50 350.00,196.50 350.00,197.00 152.00,197.00" fill="#6e3b3b" opacity="0.28"/><polygon points="350.00,196.50 550.00,203.50 550.00,203.0