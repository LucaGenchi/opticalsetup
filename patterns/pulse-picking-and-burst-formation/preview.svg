<title>Electro-optic gate and polarization pulse selection — OpticalSetup setup</title><desc>An 800 nm native pulse source passes an input polarizer, electro-optic retarder and PBS. The selected port reaches a detector while the orthogonal port is dumped. Native polarization routing and EOM modulation are represented. This scene does not claim a synchronized one-in-80 picker or programmable burst schedule; those require external timing hardware.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="18" y="148" width="772" height="274" fill="#ffffff"/><polygon points="152.00,198.50 260.00,198.50 260.00,198.63 152.00,198.63" fill="#8b1a1a" opacity="0.28"/><polygon points="260.00,198.50 400.00,198.50 400.00,198.63 260.00,198.63" fill="#8b1a1a" opacity="0.28"/><polygon points="400.00,198.50 548.50,198.50 548.63,198.63 400.00,198.63" fill="#8b1a1a" opacity="0.28"/><polygon points="548.50,198.50 548.50,370.00 548.63,370.00 548.63,198.63" fill="#8b1a1a" opacity="0.14"/><polygon points="548.50,198.50 721.00,198.50 721.00,198.63 548.63,198.63" fill="#8b1a1a" opacity="0.14"/><polygon points="152.00,198.63 260.00,198.63 260.00,198.75 152.00,198.75" fill="#8b1a1a" opacity="0.28"/><polygon points="260.00,198.63 400.00,198.63 400.00,198.75 260.00,198.75" fill="#8b1a1a" opacity="0.28"/><polygon points="400.00,198.63 548.63,198.63 548.75,198.75 400.00,198.75" fill="#8b1a1a" opacity="0.28"/><polygon points="548.63,198.63 548.63,370.00 548.75,370.00 548.75,198.75" fill="#8b1a1a" opacity="0.14"/><polygon points="548.63,198.63 721.00,198.63 721.00,198.75 548.75,198.75" fill="#8b1a1a" opacity="0.14"/><polygon points="152.00,198.75 260.00,198.75 260.00,198.88 152.00,198.88" fill="#8b1a1a" opac