<title id="display-07-title">Tracked primary with secondary solar receiver</title><desc id="display-07-desc">A sun-tracking parabolic primary feeds a nonimaging secondary and thermal receiver; a pointing sensor commands the tracker independently. Arrows indicate connections, not calculated ray trajectories.</desc>
<defs><marker id="display-07-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#78dfb0" stroke-width="1.5"/></marker><marker id="display-07-reference" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#efbe71" stroke-width="1.5"/></marker><marker id="display-07-signal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#a6b9db" stroke-width="1.5"/></marker><pattern id="display-07-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#34465a"/></pattern></defs>
<rect width="960" height="440" fill="#101e2b"/><rect width="960" height="440" fill="url(#display-07-grid)"/>
<g fill="none" stroke-width="2"><path d="M120,210L210,210" stroke="#78dfb0" marker-end="url(#display-07-light)"><title>sunlight</title></path><path d="M290,210L380,210" stroke="#78dfb0" marker-end="url(#display-07-light)"><title>primary focus</title></path><path d="M460,210L550,210" stroke="#78dfb0" marker-end="url(#display-07-light)"><title>secondary collection</title></path><path d="M630,210L730,210" stroke="#a6b9db" stroke-dasharray="6 5" marker-end="url(#display-07-signal)"><title>thermal flow</title></path><path d="M110.87720942468198,184.571709885556L219.122790575318,95.42829011444398" stroke="#78dfb0" marker-end="url(#display-07-light)"><title>direction sample</title></path><path d="M270.7591253696706,104.19150060886916L399.2408746303294,315.80849939113085" stroke="#a6b9db" stroke-dasharray="6 5" marker-end="url(#display-07-signal)"><title>pointing error</title></path><path d="M389.122790575318,324.571709885556L280.877209424682,235.428290114444" stroke="#a6b9db" stroke-dasharray="6 5" marker-end="url(#display-07-signal)"><title>orientation</title></path></g>
<g transform="translate(80,210)">
<title>Solar disk: Extended source with approximately 0.53° angular diameter.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><path d="M-13 0H13M0-13V13" stroke="#587088" stroke-width="1.5"/>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">1</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Solar disk</tspan></text></g><g transform="translate(250,210)">
