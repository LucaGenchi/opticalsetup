<title>Annular pupil illumination — OpticalSetup setup</title><desc>Real opaque masks admit the two meridional sections of an annular pupil, between 9 and 12 mm from the axis. A condenser brings the oblique ray bundles to the specimen camera. This is an actual 2D cross-section of annular illumination. A complete azimuthal cone, scattering contrast and dark-field specimen response require 3D scattering and are not calculated.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="-2" y="128" width="447.4" height="160" fill="#ffffff"/><polygon points="132.00,185.00 190.00,185.00 190.00,186.25 132.00,186.25" fill="#65ff00" opacity="0.28"/><polygon points="132.00,186.25 250.00,186.25 250.00,187.50 132.00,187.50" fill="#65ff00" opacity="0.28"/><polygon points="250.00,186.25 350.00,200.00 350.00,200.00 250.00,187.50" fill="#65ff00" opacity="0.28"/><polygon points="132.00,187.50 250.00,187.50 250.00,188.75 132.00,188.75" fill="#65ff00" opacity="0.28"/><polygon points="250.00,187.50 350.00,200.00 350.00,200.00 250.00,188.75" fill="#65ff00" opacity="0.28"/><polygon points="132.00,188.75 250.00,188.75 250.00,190.00 132.00,190.00" fill="#65ff00" opacity="0.28"/><polygon points="250.00,188.75 350.00,200.00 350.00,200.00 250.00,190.00" fill="#65ff00" opacity="0.28"/><polygon points="132.00,190.00 190.00,190.00 190.00,191.25 132.00,191.25" fill="#65ff00" opacity="0.28"/><polygon points="132.00,191.25 190.00,191.25 190.00,192.50 132.00,192.50" fill="#65ff00" opacity="0.28"/><polygon points="132.00,192.50 190.00,192.50 190.00,193.75 132.00,193.75" fill="#65ff00" opacity="0.28"/><polygon points="132.00,193.75 190.00,193.75 190.00,195.00 132.00,195.00" fill="#65ff00" opacity="0.28"/><polygo