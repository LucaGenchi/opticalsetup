<title>Native parabolic primary with folded solar receiver — OpticalSetup setup</title><desc>One collimated 550 nm test beam probes this 2D solar-collector geometry. Source angles can be changed manually to sample the solar disk’s approximately ±0.25° range. A 70 mm-focal-length parabolic primary and small plane secondary direct collected light onto an offset receiver. This native ray setup is a small reflective solar-collection geometry with a folding secondary, not a CPC secondary or thermal plant. The laboratory test laser is not a calibrated extended solar-radiance source; no 3D flux, thermal efficiency, tracking control or spectral throughput is calculated.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="-12" y="-22" width="413.7" height="228" fill="#ffffff"/><polygon points="122.00,80.00 200.00,80.00 200.00,81.67 122.00,81.67" fill="#a3ff00" opacity="0.28"/><polygon points="200.00,80.00 348.56,80.00 348.80,81.67 200.00,81.67" fill="#a3ff00" opacity="0.28"/><polygon points="348.56,80.00 200.00,123.33 200.00,121.32 348.80,81.67" fill="#a3ff00" opacity="0.27440000000000003"/><polygon points="122.00,81.67 200.00,81.67 200.00,83.33 122.00,83.33" fill="#a3ff00" opacity="0.28"/><polygon points="200.00,81.67 348.80,81.67 349.00,83.33 200.00,83.33" fill="#a3ff00" opacity="0.28"/><polygon points="348.80,81.67 200.00,121.32 200.00,119.32 349.00,83.33" fill="#a3ff00" opacity="0.27440000000000003"/><polygon points="122.00,83.33 200.00,83.33 200.00,85.00 122.00,85.00" fill="#a3ff00" opacity="0.28"/><polygon points="200.00,83.33 349.00,83.33 349.19,85.00 200.00,85.00" fill="#a3ff00" opacity="0.28"/><polygon points="349.00,83.33 305.58,93.82 305.54,94.46 349.19,85.00" fill="#