<title>Faraday isolator for laser protection — OpticalSetup setup</title><desc>Two native test rows demonstrate the isolator directional gate: the forward source reaches its camera, while an independent backward source is stopped. The registry isolator is an ideal directional gate, not a resolved Faraday-rotator/polarizer assembly. Magneto-optic dispersion, isolation ratios and damage thresholds are not computed.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="-2" y="78" width="684" height="350" fill="#ffffff"/><polyline points="132.00,140.00 250.00,140.00 400.00,140.00" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="548.00,350.00 350.00,350.00" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><g transform="translate(80 140) rotate(0)"><rect x="-46" y="-17" width="92" height="34" rx="4" fill="#3a3f46" stroke="#22252a" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" letter-spacing="1.2" fill="#fff">CW LASER</text><rect x="46" y="-6" width="5" height="12" fill="#666" stroke="#444" stroke-width="1"/></g><text x="80.0" y="172.0" text-anchor="middle"  font-size="11" fill="#444">forward-input</text><g transform="translate(250 140) rotate(0)"><rect x="-23" y="-11" width="46" height="22" rx="11" fill="#6b7280" stroke="#3f4650" stroke-width="1.5"/><path d="M -12,0 L 10,0 M 10,0 L 3,-5 M 10,0 L 3,5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/></g><text x="250.0" y="166.0" text-anchor="middle"  font-size="11" fill="#444">forward-isolator</text><g transform="translate(422 140) rotate(0)"><rect x="-20" y="-30" width="40" height="60" rx="3" fill="#4b5563" stroke="#2b333d" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#fff">CAM</text><rect x="-24" y="-22" width="5" height="44" fill="#333" stroke="#2b333d"/><circle cx="13" cy="-23" r="3.1" fill="#65ff00" opacity="1" stroke="#fff" stroke-width="0.8"/></g><text x="422.0" y="185.0" text-anchor="middle"  font-size="11" fill="#444">forward-output</text><g transform="translate(600 350) rotate(180)"><rect x="-46" y="-17" width="92" height="34" rx="4" fill="#3a3f46" stroke="#22252a" stroke-width="1.5"/><text x="0" y="0" transform="rotate(180)" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" letter-spacing="1.2" fill="#fff">CW LASER</text><rect x="46" y="-6" width="5" height="12" fill="#666" stroke="#444" stroke-width="1"/></g><text x="600.0" y="382.0" text-anchor="middle"  font-size="11" fill="#444">reverse-input</text><g transform="translate(350 350) rotate(0)"><rect x="-23" y="-11" width="46" height="22" rx="11" fill="#6b7280" stroke="#3f4650" stroke-width="1.5"/><path d="M -12,0 L 10,0 M 10,0 L 3,-5 M 10,0 L 3,5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/></g><text x="350.0" y="376.0" text-anchor="middle"  font-size="11" fill="#444">reverse-isolator</text><g transform="translate(150 350) rotate(180)"><rect x="-20" y="-30" width="40" height="60" rx="3" fill="#4b5563" stroke="#2b333d" stroke-width="1.5"/><text x="0" y="0" transform="rotate(180)" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#fff">CAM</text><rect x="-24" y="-22" width="5" height="44" fill="#333" stroke="#2b333d"/><circle cx="13" cy="-23" r="3.1" fill="#88919b" opacity="0.45" stroke="#fff" stroke-width="0.8"/></g><text x="150.0" y="395.0" text-anchor="middle"  font-size="11" fill="#444">reverse-output</text></svg>
