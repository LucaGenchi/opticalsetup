<title>Fiber spatial-mode filter — OpticalSetup setup</title><desc>A 780 nm input is focused into a propagating native fiber link and recollimated at its output. The fiber follows an actual routed path with NA acceptance and attenuation. The native fiber computes geometrical acceptance, transport and specified output NA. It does not compute a Gaussian mode-overlap integral, cutoff wavelength or single-mode purity; single-mode filtering is the physical design intent.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="-42" y="141" width="664" height="197" fill="#ffffff"/><polygon points="92.00,187.00 150.00,187.00 150.00,187.25 92.00,187.25" fill="#610000" opacity="0.28"/><polygon points="150.00,187.00 180.00,190.00 180.00,190.00 150.00,187.25" fill="#610000" opacity="0.28"/><polygon points="92.00,187.25 150.00,187.25 150.00,187.50 92.00,187.50" fill="#610000" opacity="0.28"/><polygon points="150.00,187.25 180.00,190.00 180.00,190.00 150.00,187.50" fill="#610000" opacity="0.28"/><polygon points="92.00,187.50 150.00,187.50 150.00,187.75 92.00,187.75" fill="#610000" opacity="0.28"/><polygon points="150.00,187.50 180.00,190.00 180.00,190.00 150.00,187.75" fill="#610000" opacity="0.28"/><polygon points="92.00,187.75 150.00,187.75 150.00,188.00 92.00,188.00" fill="#610000" opacity="0.28"/><polygon points="150.00,187.75 180.00,190.00 180.00,190.00 150.00,188.00" fill="#610000" opacity="0.28"/><polygon points="92.00,188.00 150.00,188.00 150.00,188.25 92.00,188.25" fill="#610000" opacity="0.28"/><polygon points="150.00,188.00 180.00,190.00 180.00,190.00 150.00,188.25" fill="#610000" opacity="0.28"/><polygon points="92.00,188.25 150.00,188.25 150.00,188.50 92.00,188.50" fill="#61