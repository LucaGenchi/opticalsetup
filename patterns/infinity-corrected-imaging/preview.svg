<title>Infinity microscope with filter space — OpticalSetup setup</title><desc>A generic 10× infinity objective faces a 2 mm object at its working-distance focus. A 200 mm tube lens and 550 nm filter deliver the ray bundle to a real camera. Native 2D geometrical rays are computed. Diffraction, target-image irradiance and real-lens aberrations are not calculated; ideal object-image markers are separate paraxial constructions. Objective correction is a generic equivalent-lens model, not a manufacturer prescription.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="31.4" y="137" width="562.6" height="142" fill="#ffffff"/><polyline points="81.00,200.00 100.00,201.00 210.00,201.28 320.00,201.57 520.00,200.52" fill="none" stroke="#a3ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="81.00,200.00 100.00,200.66 210.00,200.86 320.00,201.05 520.00,200.35" fill="none" stroke="#a3ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="81.00,200.00 100.00,200.33 210.00,200.43 320.00,200.52 520.00,200.17" fill="none" stroke="#a3ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="81.00,200.00 100.00,200.00 210.00,200.00 320.00,200.00 520.00,200.00" fill="none" stroke="#a3ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="81.00,200.00 100.00,199.67 210.00,199.57 320.00,199.48 520.00,199.83" fill="none" stroke="#a3ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="81.00,200.00 100.00,199.34 210.00,199.14 320.00,198.95 520.00,199.65" fill="none" stroke="#a3ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="81.00,200.00 100.00,199.00 210.00,198.72 320.00,198.43 520.00,199.48" fill="none" stroke="#a3ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="520.00,190.00 520.00,204.40" fill="none" stroke="#a3ff00" stroke-width="2.2" opacity="0.85" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/><polygon points="520.00,210.00 516.60,203.20 523.40,203.20" fill="#a3ff00" opacity="0.85"/><g transform="translate(80 200) rotate(0)"><line x1="-7" y1="0" x2="7" y2="0" stroke="#888" stroke-width="1.2"/><polyline points="0.0,1.0 0.0,-0.4" fill="none" stroke="#a3ff00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polygon points="0.0,-1.0 -0.3,-0.3 0.3,-0.3" fill="#a3ff00"/></g><text x="80.0" y="220.0" text-anchor="middle"  font-size="11" fill="#444">object</text><g transform="translate(116 200) rotate(180)"><path d="M 16,-5.5 L 7,-12.5 L -21,-12.5 L -21,12.5 L 7,12.5 L 16,5.5 Z" fill="#8d98a5" stroke="none"/><path d="M 7,-12.5 L -21,-12.5 L -21,12.5 L 7,12.5" fill="none" stroke="#4d565f" stroke-width="1.5" stroke-linejoin="round"/><line x1="7" y1="-12.5" x2="7" y2="12.5" stroke="#4d565f" stroke-width="1"/><rect x="-21" y="-12.5" width="2.4" height="7.50" fill="#2f3e4d"/><rect x="-21" y="5.00" width="2.4" height="7.50" fill="#2f3e4d"/></g><text x="116.0" y="228.5" text-anchor="middle"  font-size="11" fill="#444">objective</text><g transform="translate(210 200) rotate(0)"><rect x="-2.5" y="-12.7" width="5" height="25.4" fill="#bfe3c9" stroke="#557" stroke-width="1.5"/></g><text x="210.0" y="228.7" text-anchor="middle"  font-size="11" fill="#444">filter</text><g transform="translate(320 200) rotate(0)"><path d="M 0,-30 Q 9,0 0,30 Q -9,0 0,-30 Z" fill="#c9e4f5" stroke="#4a90c4" stroke-width="1.5"/></g><text x="320.0" y="246.0" text-anchor="middle"  font-size="11