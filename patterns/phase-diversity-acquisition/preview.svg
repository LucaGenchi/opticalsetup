<title>Native simultaneous focus-diversity cameras — OpticalSetup setup</title><desc>A 6 mm collimated beam is split into two equal branches. Matched 50 mm lenses focus onto one camera at the nominal focal plane and another 10 mm beyond it. The native tracer calculates paraxial focusing and detector spot size. The source is a test beam rather than an extended unknown object; no diffraction PSF, aberration estimator, phase-diversity inverse solver or calibrated pupil phase is computed.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="-12" y="51" width="491.2" height="289" fill="#ffffff"/><polygon points="122.00,97.00 247.00,97.00 247.25,97.25 122.00,97.25" fill="#65ff00" opacity="0.28"/><polygon points="247.00,97.00 247.00,190.00 247.25,190.00 247.25,97.25" fill="#65ff00" opacity="0.14"/><polygon points="247.00,190.00 250.60,250.00 250.55,250.00 247.25,190.00" fill="#65ff00" opacity="0.14"/><polygon points="247.00,97.00 340.00,97.00 340.00,97.25 247.25,97.25" fill="#65ff00" opacity="0.14"/><polygon points="340.00,97.00 390.00,100.00 390.00,100.00 340.00,97.25" fill="#65ff00" opacity="0.14"/><polygon points="122.00,97.25 247.25,97.25 247.50,97.50 122.00,97.50" fill="#65ff00" opacity="0.28"/><polygon points="247.25,97.25 247.25,190.00 247.50,190.00 247.50,97.50" fill="#65ff00" opacity="0.14"/><polygon points="247.25,190.00 250.55,250.00 250.50,250.00 247.50,190.00" fill="#65ff00" opacity="0.14"/><polygon points="247.25,97.25 340.00,97.25 340.00,97.50 247.50,97.50" fill="#65ff00" opacity="0.14"/><polygon points="340.00,97.25 390.00,100.00 390.00,100.00 340.00,97.50" fill="#65ff00" opacity="0.14"/><polygon points="122.00,97.50 247.50,97.50 247.75,97.75 122.00,97.75" fill=