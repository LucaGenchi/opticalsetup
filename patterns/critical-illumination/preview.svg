<title>Critical LED illumination — OpticalSetup setup</title><desc>Three lamp points are directly imaged at unit magnification by a 20 mm condenser onto a specimen-plane camera 40 mm behind it. Native 2D geometrical rays are computed. Diffraction, target-image irradiance and real-lens aberrations are not calculated; ideal object-image markers are separate paraxial constructions. Lamp structure is sampled by three emitters; surface irradiance and uniformity are not calibrated.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="19" y="138" width="230.2" height="140" fill="#ffffff"/><polyline points="80.00,197.00 120.00,202.62 160.00,203.00" fill="none" stroke="#a3ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="80.00,197.00 120.00,200.73 160.00,203.00" fill="none" stroke="#a3ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="80.00,197.00 120.00,198.86 160.00,203.00" fill="none" stroke="#a3ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="80.00,197.00 120.00,197.00 160.00,203.00" fill="none" stroke="#a3ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="80.00,197.00 120.00,195.14 160.00,203.00" fill="none" stroke="#a3ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="80.00,197.00 120.00,193.27 160.00,203.00" fill="none" stroke="#a3ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="80.00,197.00 120.00,191.38 160.00,203.00" fill="none" stroke="#a3ff00" s