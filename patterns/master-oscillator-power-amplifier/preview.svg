<title>Master pulse source seeding a parametric power amplifier — OpticalSetup setup</title><desc>A native 800 nm master pulse source seeds the OPA lower port; a separate 532 nm pump supplies amplification energy. The signal, residual pump and idler leave distinct physical output ports. This is a parametric MOPA implementation rather than an inversion amplifier. It models pump-limited seeded gain, not gain-medium storage, ASE, phase matching or amplifier isolation.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="18" y="187.25" width="1542" height="364.75" fill="#ffffff"/><polyline points="152.00,318.00 544.00,318.00" fill="none" stroke="#8b1a1a" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="450.00,418.00 450.00,282.00 544.00,282.00" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="662.00,300.00 730.00,300.00" fill="none" stroke="#6e3b3b" stroke-width="2" opacity="0.3509514565929954" stroke-linejoin="round" stroke-linecap="round" /><polyline points="662.00,318.00 1491.00,318.00" fill="none" stroke="#8b1a1a" stroke-width="2" opacity="0.3518947123413193" stroke-linejoin="round" stroke-linecap="round" /><polyline points="662.00,282.00 690.00,282.00" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.9471598310656851" stroke-linejoin="round" stroke-linecap="round" /><g transform="translate(100 318) rotate(0)"><rect x="-46" y="-17" width="92" height="34" rx="4" fill="#3a3f46" stroke="#22252a" stroke-width="1.5"/><text x="0" y="-3"  text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" letter-spacing="1.5" fil