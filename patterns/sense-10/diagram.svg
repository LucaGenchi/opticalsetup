<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" class="pattern-diagram" role="img" aria-labelledby="sense-10-title sense-10-desc">
<!-- SPDX-FileCopyrightText: 2026 Luca Genchi and contributors
     SPDX-License-Identifier: GPL-3.0-or-later -->
<title id="sense-10-title">180-view transmission tomography</title><desc id="sense-10-desc">A collimated probe records transmission through a rotating specimen at 1° increments over 180°; a flat-field frame accompanies the projections. Arrows indicate connections, not calculated ray trajectories.</desc>
<defs><marker id="sense-10-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#78dfb0" stroke-width="1.5"/></marker><marker id="sense-10-reference" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#efbe71" stroke-width="1.5"/></marker><marker id="sense-10-signal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#a6b9db" stroke-width="1.5"/></marker><pattern id="sense-10-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#34465a"/></pattern></defs>
<rect width="960" height="440" fill="#101e2b"/><rect width="960" height="440" fill="url(#sense-10-grid)"/>
<g fill="none" stroke-width="2"><path d="M120,210L210,210" stroke="#78dfb0" marker-end="url(#sense-10-light)"><title>illumination</title></path><path d="M290,210L380,210" stroke="#78dfb0" marker-end="url(#sense-10-light)"><title>parallel beam</title></path><path d="M460,210L550,210" stroke="#78dfb0" marker-end="url(#sense-10-light)"><title>projection</title></path><path d="M630,210L730,210" stroke="#a6b9db" stroke-dasharray="6 5" marker-end="url(#sense-10-signal)"><title>180 frames</title></path><path d="M288.6246303408268,80.3989389379149L731.3753696591732,199.6010610620851" stroke="#efbe71" marker-end="url(#sense-10-reference)"><title>normalization</title></path><path d="M770,250L770,320L420,320L420,250" stroke="#a6b9db" stroke-dasharray="6 5" marker-end="url(#sense-10-signal)"><title>next angle</title></path></g>
<g transform="translate(80,210)">
<title>Uniform probe: Illumination for transmission projections.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(1) rotate(0)"><g transform="scale(1)"><circle r="4.5" fill="#65ff00" stroke="#333" stroke-width="1"/><line x1="6.0" y1="0.0" x2="11.0" y2="0.0" stroke="#65ff00" stroke-width="1.6" stroke-linecap="round"/><line x1="4.2" y1="4.2" x2="7.8" y2="7.8" stroke="#65ff00" stroke-width="1.6" stroke-linecap="round"/><line x1="0.0" y1="6.0" x2="0.0" y2="11.0" stroke="#65ff00" stroke-width="1.6" stroke-linecap="round"/><line x1="-4.2" y1="4.2" x2="-7.8" y2="7.8" stroke="#65ff00" stroke-width="1.6" stroke-linecap="round"/><line x1="-6.0" y1="0.0" x2="-11.0" y2="0.0" stroke="#65ff00" stroke-width="1.6" stroke-linecap="round"/><line x1="-4.2" y1="-4.2" x2="-7.8" y2="-7.8" stroke="#65ff00" stroke-width="1.6" stroke-linecap="round"/><line x1="-0.0" y1="-6.0" x2="-0.0" y2="-11.0" stroke="#65ff00" stroke-width="1.6" stroke-linecap="round"/><line x1="4.2" y1="-4.2" x2="7.8" y2="-7.8" stroke="#65ff00" stroke-width="1.6" stroke-linecap="round"/></g></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">1</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Uniform probe</tspan></text></g><g transform="translate(250,210)">
<title>Collimator: Approximate parallel-beam acquisition.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(1) rotate(0)"><path d="M 0,-12.7 Q 9,0 0,12.7 Q -9,0 0,-12.7 Z" fill="#c9e4f5" stroke="#4a90c4" stroke-width="1.5"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">2</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Collimator</tspan></text></g><g transform="translate(420,210)">
<title>Rotating specimen: One exposure at each angle from 0° to 179°.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(0.6) rotate(0)"><path d="M -37,-8 L -37,6 L -15,6" fill="none" stroke="#4d565f" stroke-width="4"/><path d="M 37,-8 L 37,6 L 15,6" fill="none" stroke="#4d565f" stroke-width="4"/><rect x="-25" y="-3.00" width="50" height="6" fill="#c9e4f5" fill-opacity="0.75" stroke="none"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">3</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Rotating specimen</tspan></text></g><g transform="translate(590,210)">
<title>Projection camera: Record transmitted intensity.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(1) rotate(0)"><rect x="-20" y="-15" width="40" height="30" rx="3" fill="#4b5563" stroke="#2b333d" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#fff">CAM</text><rect x="-24" y="-7" width="5" height="14" fill="#333" stroke="#2b333d"/><circle cx="13" cy="-8" r="3.1" fill="#88919b" opacity="0.45" stroke="#fff" stroke-width="0.8"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">4</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Projection camera</tspan></text></g><g transform="translate(770,210)">
<title>Sinogram / inverse: Form line integrals after dark and flat-field correction.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><path d="M-13 0H13M0-13V13" stroke="#587088" stroke-width="1.5"/>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">5</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Sinogram / inverse</tspan></text></g><g transform="translate(250,70)">
<title>Empty-field frame: Measure I0 before inserting the specimen.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><path d="M-13 0H13M0-13V13" stroke="#587088" stroke-width="1.5"/>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">6</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Empty-field frame</tspan></text></g>
<g font-family="Arial,sans-serif" font-size="12" fill="#b3c5d4"><path d="M30 418H56" stroke="#78dfb0" stroke-width="2"/><text x="64" y="422">Optical path</text><path d="M188 418H214" stroke="#efbe71" stroke-width="2"/><text x="222" y="422">Reference / auxiliary</text><path d="M402 418H428" stroke="#a6b9db" stroke-width="2" stroke-dasharray="5 4"/><text x="436" y="422">Signal / control</text><text x="930" y="422" text-anchor="end">Arrangement map · not to scale</text></g>
</svg>
