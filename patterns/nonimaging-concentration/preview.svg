<title>Native planar nonimaging funnel — OpticalSetup setup</title><desc>Two 200 mm planar reflecting walls narrow a 40 mm entrance to a 10 mm exit. A 14 mm detector receives direct and wall-reflected rays from a collimated input. This native 2D planar funnel is a nonimaging collection variant, not a compound-parabolic surface. Rays and reflection losses are computed; there is no 3D CPC concentration bound, diffraction, radiance calibration or etendue calculation.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="-12" y="24.778843984868118" width="506.8" height="157.2211560151319" fill="#ffffff"/><polygon points="122.00,80.00 200.00,80.00 222.22,81.67 122.00,81.67" fill="#65ff00" opacity="0.28"/><polygon points="200.00,80.00 377.11,106.72 384.57,106.16 222.22,81.67" fill="#65ff00" opacity="0.27440000000000003"/><polygon points="377.11,106.72 421.00,93.17 421.00,94.91 384.57,106.16" fill="#65ff00" opacity="0.268912"/><polygon points="122.00,81.67 222.22,81.67 244.44,83.33 122.00,83.33" fill="#65ff00" opacity="0.28"/><polygon points="222.22,81.67 384.57,106.16 392.04,105.60 244.44,83.33" fill="#65ff00" opacity="0.27440000000000003"/><polygon points="384.57,106.16 421.00,94.91 421.00,96.66 392.04,105.60" fill="#65ff00" opacity="0.268912"/><polygon points="122.00,83.33 244.44,83.33 266.67,85.00 122.00,85.00" fill="#65ff00" opacity="0.28"/><polygon points="244.44,83.33 392.04,105.60 399.50,105.04 266.67,85.00" fill="#65ff00" opacity="0.27440000000000003"/><polygon points="392.04,105.60 421.00,96.66 421.00,98.40 399.50,105.04" fill="#65ff00" opacity="0.268912"/><polygon points="122.00,85.00 266.67,85.00 288.89,86.67 122.00,86.67" fill="#65ff00" opacity="0.28"/><polygon poin