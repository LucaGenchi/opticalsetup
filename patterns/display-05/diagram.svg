<title id="display-05-title">Pupil-relayed raster retinal projector</title><desc id="display-05-desc">An intensity-modulated RGB source feeds fast and slow scan axes; a relay conjugates the scanner pivot to the eye pupil. Arrows indicate connections, not calculated ray trajectories.</desc>
<defs><marker id="display-05-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#78dfb0" stroke-width="1.5"/></marker><marker id="display-05-reference" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#efbe71" stroke-width="1.5"/></marker><marker id="display-05-signal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#a6b9db" stroke-width="1.5"/></marker><pattern id="display-05-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#34465a"/></pattern></defs>
<rect width="960" height="440" fill="#101e2b"/><rect width="960" height="440" fill="url(#display-05-grid)"/>
<g fill="none" stroke-width="2"><path d="M120,210L210,210" stroke="#78dfb0" marker-end="url(#display-05-light)"><title>pixels</title></path><path d="M290,210L380,210" stroke="#78dfb0" marker-end="url(#display-05-light)"><title>horizontal sweep</title></path><path d="M460,210L550,210" stroke="#78dfb0" marker-end="url(#display-05-light)"><title>two-axis raster</title></path><path d="M630,210L730,210" stroke="#78dfb0" marker-end="url(#display-05-light)"><title>pupil conjugate</title></path><path d="M732.8609323645896,224.85562705416416L457.13906763541036,335.14437294583587" stroke="#78dfb0" marker-end="url(#display-05-light)"><title>eye focusing</title></path><path d="M219.12279057531802,95.428290114444L110.877209424682,184.571709885556" stroke="#a6b9db" stroke-dasharray="6 5" marker-end="url(#display-05-signal)"><title>pixel timing</title></path><path d="M250,110L250,170" stroke="#a6b9db" stroke-dasharray="6 5" marker-end="url(#display-05-signal)"><title>line timing</title></path><path d="M280.877209424682,95.428290114444L389.122790575318,184.571709885556" stroke="#a6b9db" stroke-dasharray="6 5" marker-end="url(#display-05-signal)"><title>frame timing</title></path></g>
<g transform="translate(80,210)">
<title>Modulated RGB: Set intensity per raster pixel.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><path d="M-13 0H13M0-13V13" stroke="#587088" stroke-width="1.5"/>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">1</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Modulated RGB</tspan></text></g><g transform="translate(250,210)">
<title>Fast scan: Example 15 kHz horizontal scan.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(1) rotate(0)"><circle r="4.5" fill="#777" stroke="#444" stroke-width="1.2"/><g transform="rotate(0)"><line x1="0" y1="-10" x2="0" y2="10" stroke="#444" stroke-width="3"/></g><path d="M -9,-13 A 15 15 0 0 1 9,-13" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="3 2"/><path d="M -9,13 A 15 15 0 0 0 9,13" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="3 2"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">2</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Fast scan</tspan></text></g><g transform="translate(420,210)">
<title>Slow scan: Example 60 Hz frame scan.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(1) rotate(0)"><circle r="4.5" fill="#777" stroke="#444" stroke-width="1.2"/><g transform="rotate(0)"><line x1="0" y1="-10" x2="0" y2="10" stroke="#444" stroke-width="3"/></g><path d="M -9,-13 A 15 15 0 0 1 9,-13" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="3 2"/><path d="M -9,13 A 15 15 0 0 0 9,13" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="3 2"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">3</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Slow scan</tspan></text></g><g transform="translate(590,210)">
<title>Pupil relay: Conjugate the scan pivot to the entrance pupil.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(0.2727272727272727) rotate(0)"><line x1="-75" y1="0" x2="75" y2="0" stroke="#b6bdc6" stroke-width="1" stroke-dasharray="4 4"/><path d="M -75,-12.7 Q -66,0 -75,12.7 Q -84,0 -75,-12.7 Z" fill="#c9e4f5" stroke="#4a90c4" stroke-width="1.5"/><path d="M 75,-12.7 Q 84,0 75,12.7 Q 66,0 75,-12.7 Z" fill="#c9e4f5" stroke="#4a90c4" stroke-width="1.5"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">4</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Pupil relay</tspan></text></g><g transform="translate(770,210)">
<title>Eye pupil: Accept angular raster without large pupil walk.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(1) rotate(0)"><g transform="scale(1)"><circle r="15" fill="#fff" stroke="#4d565f" stroke-width="1.5"/><path d="M -14.2,-7 Q -21,0 -14.2,7" fill="rgba(160,200,240,0.45)" stroke="#4a7fa8" stroke-width="1.2"/><path d="M -14.5,-9 L -10.5,-5.5" stroke="#7a5230" stroke-width="2.4" stroke-linecap="round"/><path d="M -14.5,9 L -10.5,5.5" stroke="#7a5230" stroke-width="2.4" stroke-linecap="round"/><ellipse cx="-8.5" cy="0" rx="3" ry="6.5" fill="#cfe4f5" stroke="#4a7fa8" stroke-width="1"/><path d="M 7,-13 A 15 15 0 0 1 7,13" fill="none" stroke="#c86a6a" stroke-width="2.5"/></g></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">5</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Eye pupil</tspan></text></g><g transform="translate(250,70)">
<title>Raster sequencer: Synchronize source intensity with both scan axes.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><path d="M-13 0H13M0-13V13" stroke="#587088" stroke-width="1.5"/>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">6</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Raster sequencer</tspan></text></g><g transform="translate(420,350)">
<title>Retinal image: Intended image formed by the eye optics.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><path d="M-13 0H13M0-13V13" stroke="#587088" stroke-width="1.5"/>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">7</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Retinal image</tspan></text></g>
<g font-family="Arial,sans-serif" font-size="12" fill="#b3c5d4"><path d="M30 418H56" stroke="#78dfb0" stroke-width="2"/><text x="64" y="422">Optical path</text><path d="M188 418H214" stroke="#efbe71" stroke-width="2"/><text x="222" y="422">Reference / auxiliary</text><path d="M402 418H428" stroke="#a6b9db" stroke-width="2" stroke-dasharray="5 4"/><text x="436" y="422">Signal / control</text><text x="930" y="422" text-anchor="end">Arrangement map · not to scale</text></g>
</svg>
