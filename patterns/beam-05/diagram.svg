<title id="beam-05-title">Gaussian-to-top-hat refractive mapper</title><desc id="beam-05-desc">Two aspheric surfaces redistribute a nominal 3 mm radius Gaussian input into a 4 mm radius flat-top output without deliberately clipping the center. Arrows indicate connections, not calculated ray trajectories.</desc>
<defs><marker id="beam-05-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#78dfb0" stroke-width="1.5"/></marker><marker id="beam-05-reference" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#efbe71" stroke-width="1.5"/></marker><marker id="beam-05-signal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#a6b9db" stroke-width="1.5"/></marker><pattern id="beam-05-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#34465a"/></pattern></defs>
<rect width="960" height="440" fill="#101e2b"/><rect width="960" height="440" fill="url(#beam-05-grid)"/>
<g fill="none" stroke-width="2"><path d="M140,190L300,190" stroke="#78dfb0" marker-end="url(#beam-05-light)"><title>light path</title></path><path d="M380,190L540,190" stroke="#78dfb0" marker-end="url(#beam-05-light)"><title>light path</title></path><path d="M620,190L780,190" stroke="#78dfb0" marker-end="url(#beam-05-light)"><title>light path</title></path><path d="M433.9683450617613,299.62973590538815L366.0316549382387,220.37026409461185" stroke="#efbe71" marker-end="url(#beam-05-reference)"><title>surface prescription</title></path><path d="M486.0316549382387,299.62973590538815L553.9683450617613,220.37026409461185" stroke="#efbe71" marker-end="url(#beam-05-reference)"><title>wavefront constraint</title></path></g>
<g transform="translate(100,190)">
<title>Gaussian input: Design input intensity and radius are part of the prescription.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(0.46153846153846156) rotate(0)"><rect x="-46" y="-17" width="92" height="34" rx="4" fill="#3a3f46" stroke="#22252a" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" letter-spacing="1.2" fill="#fff">CW LASER</text><rect x="46" y="-4.5" width="5" height="9" fill="#666" stroke="#444" stroke-width="1"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">1</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Gaussian input</tspan></text></g><g transform="translate(340,190)">
<title>Remapping surface: Redirects annuli according to cumulative input power.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(1) rotate(0)"><path d="M -0.26 12.7 L -0.7 11.64 L -1.11 10.58 L -1.47 9.53 L -1.8 8.47 L -2.08 7.41 L -2.32 6.35 L -2.53 5.29 L -2.7 4.23 L -2.83 3.17 L -2.93 2.12 L -2.98 1.06 L -3 0 L -2.98 -1.06 L -2.93 -2.12 L -2.83 -3.18 L -2.7 -4.23 L -2.53 -5.29 L -2.32 -6.35 L -2.08 -7.41 L -1.8 -8.47 L -1.47 -9.52 L -1.11 -10.58 L -0.7 -11.64 L -0.26 -12.7 L 3 -12.7 L 3 -11.64 L 3 -10.58 L 3 -9.53 L 3 -8.47 L 3 -7.41 L 3 -6.35 L 3 -5.29 L 3 -4.23 L 3 -3.17 L 3 -2.12 L 3 -1.06 L 3 0 L 3 1.06 L 3 2.12 L 3 3.18 L 3 4.23 L 3 5.29 L 3 6.35 L 3 7.41 L 3 8.47 L 3 9.52 L 3 10.58 L 3 11.64 L 3 12.7 L -0.26 12.7 Z" fill="#c9e4f5" fill-opacity="0.72" stroke="#4a90c4" stroke-width="1.5" stroke-linejoin="round"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">2</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Remapping surface</tspan></text></g><g transform="translate(580,190)">
<title>Recollimating surface: Restores a planar output wavefront.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(1) rotate(0)"><path d="M -0.26 12.7 L -0.7 11.64 L -1.11 10.58 L -1.47 9.53 L -1.8 8.47 L -2.08 7.41 L -2.32 6.35 L -2.53 5.29 L -2.7 4.23 L -2.83 3.17 L -2.93 2.12 L -2.98 1.06 L -3 0 L -2.98 -1.06 L -2.93 -2.12 L -2.83 -3.18 L -2.7 -4.23 L -2.53 -5.29 L -2.32 -6.35 L -2.08 -7.41 L -1.8 -8.47 L -1.47 -9.52 L -1.11 -10.58 L -0.7 -11.64 L -0.26 -12.7 L 3 -12.7 L 3 -11.64 L 3 -10.58 L 3 -9.53 L 3 -8.47 L 3 -7.41 L 3 -6.35 L 3 -5.29 L 3 -4.23 L 3 -3.17 L 3 -2.12 L 3 -1.06 L 3 0 L 3 1.06 L 3 2.12 L 3 3.18 L 3 4.23 L 3 5.29 L 3 6.35 L 3 7.41 L 3 8.47 L 3 9.52 L 3 10.58 L 3 11.64 L 3 12.7 L -0.26 12.7 Z" fill="#c9e4f5" fill-opacity="0.72" stroke="#4a90c4" stroke-width="1.5" stroke-linejoin="round"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">3</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Recollimating surface</tspan></text></g><g transform="translate(820,190)">
<title>4 mm top-hat: Target profile at the specified output plane.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><path d="M-13 0H13M0-13V13" stroke="#587088" stroke-width="1.5"/>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">4</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">4 mm top-hat</tspan></text></g><g transform="translate(460,330)">
<title>Cumulative power map: Equal power within corresponding input/output radii.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><path d="M-13 0H13M0-13V13" stroke="#587088" stroke-width="1.5"/>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">5</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Cumulative power map</tspan></text></g>
<g font-family="Arial,sans-serif" font-size="12" fill="#b3c5d4"><path d="M30 418H56" stroke="#78dfb0" stroke-width="2"/><text x="64" y="422">Optical path</text><path d="M188 418H214" stroke="#efbe71" stroke-width="2"/><text x="222" y="422">Reference / auxiliary</text><path d="M402 418H428" stroke="#a6b9db" stroke-width="2" stroke-dasharray="5 4"/><text x="436" y="422">Signal / control</text><text x="930" y="422" text-anchor="end">Arrangement map · not to scale</text></g>
</svg>
