<title>Unit-magnification 4f relay — OpticalSetup setup</title><desc>Two 100 mm thin lenses relay an object plane to an inverted image over 400 mm; the shared focal plane remains accessible. The fan traces on-axis geometrical rays, while the F marker is a separate paraxial image construction that does not model downstream clipping. No target-image irradiance, diffraction-limited transfer function or real-lens aberration is computed.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="31.4" y="147" width="522.6" height="122" fill="#ffffff"/><polyline points="81.00,200.00 180.00,206.92 380.00,207.06 480.00,200.07" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="81.00,200.00 180.00,204.61 380.00,204.70 480.00,200.05" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="81.00,200.00 180.00,202.30 380.00,202.35 480.00,200.02" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="81.00,200.00 180.00,200.00 380.00,200.00 480.00,200.00" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="81.00,200.00 180.00,197.70 380.00,197.65 480.00,199.98" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="81.00,200.00 180.00,195.39 380.00,195.30 480.00,199.95" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="81.00,200.00 180.00,193.08 380.00,192.94 480.00,199.93" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="479.40,195.00 479.40,205.00" fill="none" stroke="#65ff00" stroke-width="2.2" opacity="0.85" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/><polyline points="479.40,205.00 484.20,205.00" fill="none" stroke="#65ff00" stroke-width="2.2" opacity="0.85" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/><polyline points="479.40,200.50 483.00,200.50" fill="none" stroke="#65ff00" stroke-width="2.2" opacity="0.85" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/><g transform="translate(80 200) rotate(0)"><line x1="-7" y1="0" x2="7" y2="0" stroke="#888" stroke-width="1.2"/><polyline points="-0.6,5.0 -0.6,-5.0" fill="none" stroke="#65ff00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="-0.6,-5.0 4.2,-5.0" fill="none" stroke="#65ff00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="-0.6,-0.5 3.0,-0.5" fill="none" stroke="#65ff00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="80.0" y="228.0" text-anchor="middle"  font-size="11" fill="#444">object</text><g transform="translate(180 200) rotate(0)"><path d="M 0,-20 Q 9,0 0,20 Q -9,0 0,-20 Z" fill="#c9e4f5" stroke="#4a90c4" stroke-width="1.5"/></g><text x="180.0" y="236.0" text-anchor="middle"  font-size="11" fill="#444">first</text><g transform="translate(380 200) rotate(0)"><path d="M 0,-20 Q 9,0 0,20 Q -9,0 0,-20 Z" fill="#c9e4f5" stroke="#4a90c4" stroke-width="1.5"/></g><text x="380.0" y="236.0" text-anchor="middle"  font-size="11" fill="#444">second</text><g transform="translate(502 200) rotate(0)"><rect x="-20" y="-20" width="40" height="40" rx="3" fill="#4b5563" stroke="#2b333d" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill