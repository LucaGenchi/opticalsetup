<title>Single-axis pupil-conjugate scanner — OpticalSetup setup</title><desc>A real galvo feeds a 75/75 mm pupil relay and a fixed generic objective. The camera monitors the focused meridional scan. Native 2D geometrical rays are computed. Diffraction, target-image irradiance and real-lens aberrations are not calculated; ideal object-image markers are separate paraxial constructions. Objective pupils and high-NA field distortion are generic; the setup does not calibrate a commercial scanner.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="-22" y="22.42283553372465" width="295.4" height="483.57716446627535" fill="#ffffff"/><polygon points="112.00,78.50 198.50,78.50 198.63,78.63 112.00,78.63" fill="#65ff00" opacity="0.28"/><polygon points="198.50,78.50 198.50,155.00 198.63,155.00 198.63,78.63" fill="#65ff00" opacity="0.28"/><polygon points="198.50,155.00 201.50,305.00 201.38,305.00 198.63,155.00" fill="#65ff00" opacity="0.28"/><polygon points="201.50,305.00 201.50,396.00 201.38,396.00 201.38,305.00" fill="#65ff00" opacity="0.28"/><polygon points="201.50,396.00 200.00,416.00 200.00,416.00 201.38,396.00" fill="#65ff00" opacity="0.28"/><polygon points="112.00,78.63 198.63,78.63 198.75,78.75 112.00,78.75" fill="#65ff00" opacity="0.28"/><polygon points="198.63,78.63 198.63,155.00 198.75,155.00 198.75,78.75" fill="#65ff00" opacity="0.28"/><polygon points="198.63,155.00 201.38,305.00 201.25,305.00 198.75,155.00" fill="#65ff00" opacity="0.28"/><polygon points="201.38,305.00 201.38,396.00 201.25,396.00 201.25,305.00" fill="#65ff00" opacity="0.28"/><polygon points="201.38,396.00 200.00,416.00 200.00,416.00 201.25,396.00" fill="#65ff00" opacity="0.28"/><polygon points="112.00,78