<title>Quarter-wave shared-aperture return — OpticalSetup setup</title><desc>A native PBS passes horizontal light through a 45° quarter-wave plate to a mirror. The double pass changes the return polarization and directs it to the receive detector. Native Stokes retardance and specular return routing are computed. A rough or depolarizing target, coating phase and certified extinction are not modeled.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="-2" y="147" width="484.7" height="269" fill="#ffffff"/><polyline points="132.00,200.00 200.00,200.00" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="200.00,200.00 300.00,200.00" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="300.00,200.00 400.00,200.00 300.00,200.00" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="300.00,200.00 200.00,200.00" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="200.00,200.00 200.00,331.00" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><g transform="translate(80 200) rotate(0)"><rect x="-46" y="-17" width="92" height="34" rx="4" fill="#3a3f46" stroke="#22252a" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" letter-spacing="1.2" fill="#fff">CW LASER</text><rect x="46" y="-6" width="5" height="12" fill="#666" stroke="#444" stroke-width="1"/></g><text x="80.0" y="232.0" text-anchor="middle"  font-size="11" fill="#444">input</text><g transform="translate(200 200) rotate(0)"><rect x="-12.7" y="-12.7" width="25.4" height="25.4" fill="#d5e3f0" stroke="#3f6a92" stroke-width="1.6"/><line x1="-12.7" y1="12.7" x2="12.7" y2="-12.7" stroke="#3f6a92" stroke-width="1.6"/><text x="-12.7" y="20.7" text-anchor="start" dominant-baseline="central" font-size="8.5" fill="#3f6a92" font-weight="600" >PBS</text></g><text x="200.0" y="227.7" text-anchor="middle"  font-size="11" fill="#444">send-return-PBS</text><g transform="translate(300 200) rotate(0)"><rect x="-2.5" y="-12.7" width="5" height="25.4" fill="#e8d5ef" stroke="#8a5fa8" stroke-width="1.4"/><text x="0" y="-18.7" text-anchor="middle" dominant-baseline="central" font-size="8.5" fill="#6a4a80" >λ/4</text></g><text x="300.0" y="228.7" text-anchor="middle"  font-size="11" fill="#444">double-pass-QWP</text><g transform="translate(400 200) rotate(0)"><line x1="0" y1="-20" x2="0" y2="20" stroke="#444" stroke-width="3.5"/><line x1="-1.5" y1="-20" x2="-7.5" y2="-14" stroke="#888" stroke-width="1"/><line x1="-1.5" y1="-13.2" x2="-7.5" y2="-7.199999999999999" stroke="#888" stroke-width="1"/><line x1="-1.5" y1="-6.4" x2="-7.5" y2="-0.40000000000000036" stroke="#888" stroke-width="1"/><line x1="-1.5" y1="0.3999999999999986" x2="-7.5" y2="6.399999999999999" stroke="#888" stroke-width="1"/><line x1="-1.5" y1="7.199999999999999" x2="-7.5" y2="13.2" stroke="#888" stroke-width="1"/><line x1="-1.5" y1="14" x2="-7.5" y2="20" stroke="#888" stroke-width="1"/></g><text x="400.0" y="236.0" text-anchor="middle"  font-size="11" fill="#444">reflecting-target</text><g transform="translate(200 350) rotate(90)"><rect x="-18" y="-13" width="36" height="26" rx="3" fill="#4b5563" stroke="#2b333d" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#fff">PD</text><rect x="-19.5" y="-9" width="3" height="18" fill="#93c5fd" stroke="