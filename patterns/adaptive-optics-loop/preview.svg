<title>Native deformable mirror with science and sensing branches — OpticalSetup setup</title><desc>A native deformable mirror applies reflective tip/tilt and defocus. A physical splitter sends corrected light to a science camera and an independent lens/camera sensing branch. The bench constructs common correction and a sensing branch. The sensor is a native focal camera, not a Shack–Hartmann reconstructor; feedback is manual and only tip/tilt and paraxial defocus are modeled.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="18" y="138.8873016277919" width="684" height="433.1126983722081" fill="#ffffff"/><polygon points="152.00,194.00 394.00,194.00 394.50,194.50 152.00,194.50" fill="#65ff00" opacity="0.28"/><polygon points="394.00,194.00 394.64,344.64 395.08,345.08 394.50,194.50" fill="#65ff00" opacity="0.28"/><polygon points="394.64,344.64 550.00,345.29 550.00,345.68 395.08,345.08" fill="#65ff00" opacity="0.11200000000000002"/><polygon points="550.00,345.29 628.00,349.29 628.00,349.35 550.00,345.68" fill="#65ff00" opacity="0.11200000000000002"/><polygon points="394.64,344.64 395.28,498.00 395.68,498.00 395.08,345.08" fill="#65ff00" opacity="0.25200000000000006"/><polygon points="152.00,194.50 394.50,194.50 395.00,195.00 152.00,195.00" fill="#65ff00" opacity="0.28"/><polygon points="394.50,194.50 395.08,345.08 395.53,345.53 395.00,195.00" fill="#65ff00" opacity="0.28"/><polygon points="395.08,345.08 550.00,345.68 550.00,346.07 395.53,345.53" fill="#65ff00" opacity="0.11200000000000002"/><polygon points="550.00,345.68 628.00,349.35 628.00,349.41 550.00,346.07" fill="#65ff00" opacity="0.11200000000000002"/><polygon points="395.08,345.08 395.68,498.00 396.07,498.00 395.