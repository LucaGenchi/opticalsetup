<title>Two overlapping bandpasses with a diagnostic tap — OpticalSetup setup</title><desc>A 532 nm beam passes a 500–550 nm and a 520–540 nm filter. Their nominal overlap is 520–540 nm; an upstream tap distinguishes source loss from rejection. The supplied ray scene uses idealized bandpass and split models. It does not predict angular shifts, coating ripple, fluorescence or optical-density leakage.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="8" y="161" width="917" height="224" fill="#ffffff"/><polygon points="142.00,208.50 283.50,208.50 283.63,208.63 142.00,208.63" fill="#65ff00" opacity="0.28"/><polygon points="283.50,208.50 283.50,316.00 283.63,316.00 283.63,208.63" fill="#65ff00" opacity="0.11200000000000002"/><polygon points="283.50,208.50 480.00,208.50 480.00,208.63 283.63,208.63" fill="#65ff00" opacity="0.25200000000000006"/><polygon points="480.00,208.50 680.00,208.50 680.00,208.63 480.00,208.63" fill="#65ff00" opacity="0.25200000000000006"/><polygon points="680.00,208.50 856.00,208.50 856.00,208.63 680.00,208.63" fill="#65ff00" opacity="0.25200000000000006"/><polygon points="142.00,208.63 283.63,208.63 283.75,208.75 142.00,208.75" fill="#65ff00" opacity="0.28"/><polygon points="283.63,208.63 283.63,316.00 283.75,316.00 283.75,208.75" fill="#65ff00" opacity="0.11200000000000002"/><polygon points="283.63,208.63 480.00,208.63 480.00,208.75 283.75,208.75" fill="#65ff00" opacity="0.25200000000000006"/><polygon points="480.00,208.63 680.00,208.63 680.00,208.75 480.00,208.75" fill="#65ff00" opacity="0.25200000000000006"/><polygon points="680.00,208.63 856.00,208.63 856.00,208.75 680.00,208.75" fill="#65ff00" opacity="0.25200000000000006"/><polygon points="142.0