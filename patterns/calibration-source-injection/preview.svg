<title>Native shared-path spectral calibration injection — OpticalSetup setup</title><desc>A 532 nm test beam and a separately shuttered 546 nm calibration beam enter the same output path through a beamsplitter. A common slit and native spectrometer measure the selected input. The native source selector, slit and spectrometer path are represented with monochromatic calibration inputs. No mercury-lamp line synthesis, dispersive detector pixel calibration, polynomial fitting or calibrated wavelength residual is computed.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="-12" y="-162" width="689.2" height="481" fill="#ffffff"/><polyline points="122.00,100.00 190.00,100.00 350.00,100.00" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="350.00,100.00 350.00,6100.00" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.6499999999999999" stroke-linejoin="round" stroke-linecap="round" /><polyline points="350.00,100.00 583.00,100.00" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.6499999999999999" stroke-linejoin="round" stroke-linecap="round" /><polyline points="350.00,-28.00 350.00,30.00" fill="none" stroke="#96ff00" stroke-width="2" opacity="0.35" stroke-linejoin="round" stroke-linecap="round" /><g transform="translate(70 100) rotate(0)"><rect x="-46" y="-17" width="92" height="34" rx="4" fill="#3a3f46" stroke="#22252a" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" letter-spacing="1.2" fill="#fff">CW LASER</text><rect x="46" y="-6" width="5" height="12" fill="#666" stroke="#444" stroke-width="1"/></g><text x="70.0" y="132.0" text-anchor="middle"  font-size="11" fill="#444">test-source</text><g transform="translate(190 100) rotate(0)"><rect x="-2.5" y="-12.7" width="5" height="25.4" fill="#9aa0a6" stroke="#557" stroke-width="1.5"/></g><text x="190.0" y="128.7" text-anchor="middle"  font-size="11" fill="#444">test-shutter</text><g transform="translate(350 100) rotate(90)"><rect x="-12.7" y="-12.7" width="25.4" height="25.4" fill="#c9e4f5" stroke="#4a90c4" stroke-width="1.5"/><line x1="-12.7" y1="12.7" x2="12.7" y2="-12.7" stroke="#4a90c4" stroke-width="1.5"/></g><text x="350.0" y="127.7" text-anchor="middle"  font-size="11" fill="#444">input-combiner</text><g transform="translate(350 -80) rotate(90)"><rect x="-46" y="-17" width="92" height="34" rx="4" fill="#3a3f46" stroke="#22252a" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" letter-spacing="1.2" fill="#fff">CW LASER</text><rect x="46" y="-6" width="5" height="12" fill="#666" stroke="#444" stroke-width="1"/></g><text x="350.0" y="-15.0" text-anchor="middle"  font-size="11" fill="#444">calibration-source</text><g transform="translate(350 30) rotate(90)"><rect x="-2.5" y="-12.7" width="5" height="25.4" fill="#9aa0a6" stroke="#557" stroke-width="1.5"/></g><text x="350.0" y="49.0" text-anchor="middle"  font-size="11" fill="#444">calibration-shutter</text><g transform="translate(490 100) rotate(0)"><rect x="-2.5" y="-20" width="5" height="18" fill="#333"/><rect x="-2.5" y="2" width="5" height="18" fill="#333"/></g><text x="490.0" y="136.0" text-anchor="middle"  font-size="11" fill="#444">entrance-slit</text><g transform="translate(610 100) rotate(0)"><rect x="-27" y="-15" width="54" height="30" rx="4" fill="#44505d" stroke="#202a33" stroke-width="1.5"/><rect x="-28.7" y="-11" width="3.4" height="22" rx="1" fill="#fde68a" stroke="#26323c" stroke-width="0.8"/><text x="1" y="1"  text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight