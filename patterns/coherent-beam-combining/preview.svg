<title>Two seeded parametric amplifier arms with coherent recombination — OpticalSetup setup</title><desc>A common 800 nm master is split into two native OPA channels pumped separately at 532 nm. Equal geometrical arms meet at a combiner, with a native phase actuator and two camera readout ports. The amplifier channels use native parametric gain. Their amplified fields are not tracked as phase-coherent interferometer fields, so camera power is not a computed coherent-combining efficiency. Feedback, amplifier noise and an automatic phase servo are absent.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="18" y="115" width="1114" height="717" fill="#ffffff"/><polyline points="152.00,200.00 300.00,200.00" fill="none" stroke="#8b1a1a" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="300.00,200.00 300.00,600.00 544.00,600.00" fill="none" stroke="#8b1a1a" stroke-width="2" opacity="0.6499999999999999" stroke-linejoin="round" stroke-linecap="round" /><polyline points="300.00,200.00 544.00,200.00" fill="none" stroke="#8b1a1a" stroke-width="2" opacity="0.6499999999999999" stroke-linejoin="round" stroke-linecap="round" /><polyline points="422.00,164.00 544.00,164.00" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="662.00,200.00 900.00,200.00 900.00,600.00" fill="none" stroke="#8b1a1a" stroke-width="2" opacity="0.35301267095823974" stroke-linejoin="round" stroke-linecap="round" /><polyline points="900.00,600.00 1058.00,600.00" fill="none" stroke="#8b1a1a" stroke-width="2" opacity="0.35150633547911986" stroke-linejoin="round" stroke-linecap="round" /><p