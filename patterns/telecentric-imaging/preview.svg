<title>Object-space telecentric inspection — OpticalSetup setup</title><desc>A 100 mm lens and a 2 mm stop at its rear focal plane form an object-space telecentric meridional relay. The off-axis emitting point is 200 mm before the lens. Native 2D geometrical rays are computed. Diffraction, target-image irradiance and real-lens aberrations are not calculated; ideal object-image markers are separate paraxial constructions. A 1D slit is the meridional aperture section; no circular-pupil or unlimited-depth sharpness claim is made.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="-48.6" y="-13" width="672.6" height="292" fill="#ffffff"/><polyline points="1.00,190.00 200.00,210.92 300.00,210.51" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="1.00,190.00 200.00,205.66 300.00,207.87" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="1.00,190.00 200.00,200.43 300.00,205.24" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="1.00,190.00 200.00,195.21 300.00,202.62" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="1.00,190.00 200.00,190.00 400.00,210.00" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="1.00,190.00 200.00,184.79 300.00,197.38" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="1.00,190.00 200.00,179.57 300.00,194.76" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="1.00,190.00 200.00,174.34 300.00,192.13" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="1.00,190.00 5968.13,-437.17" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><g transform="translate(0 190) rotate(0)"><line x1="-7" y1="0" x2="7" y2="0" stroke="#888" stroke-width="1.2"/><polyline points="0.0,2.0 0.0,-0.9" fill="none" stroke="#65ff00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polygon points="0.0,-2.0 -0.7,-0.6 0.7,-0.6" fill="#65ff00"/></g><text x="0.0" y="212.0" text-anchor="middle"  font-size="11" fill="#444">object</text><g transform="translate(200 200) rotate(0)"><path d="M 0,-30 Q 9,0 0,30 Q -9,0 0,-30 Z" fill="#c9e4f5" stroke="#4a90c4" stroke-width="1.5"/></g><text x="200.0" y="246.0" text-anchor="middle"  font-size="11" fill="#444">imaging</text><g transform="translate(300 200) rotate(0)"><rect x="-2.5" y="-30" width="5" height="29" fill="#333"/><rect x="-2.5" y="1" width="5" height="29" fill="#333"/></g><text x="300.0" y="246.0" text-anchor="middle"  font-size="11" fill="#444">rear-focal-stop</text><g transform="translate(422 200) rotate(0)"><rect x="-20" y="-30" width="40" height="60" rx="3" fill="#4b5563" stroke="#2b333d" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#fff">CAM</text><rect x="-24" y="-22" width="5" height="44" fill="#333" stroke="#2b333d"/><circle cx="13" cy="-23" r="3.1" fill="#65ff00" opacity="1" stroke="#fff" stroke-width="0.8"/></g><text x="422.0" y="245.0" text-anchor="middle"  font-size="11" fill="#444">image</text></svg>
