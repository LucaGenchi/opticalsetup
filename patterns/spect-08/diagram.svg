<title id="spect-08-title">Asymmetric dual-comb absorption measurement</title><desc id="spect-08-desc">Choose two illustrative 100 MHz combs differing by 100 Hz. One crosses a gas cell and meets the local-oscillator comb on a photodiode; radio-frequency beats are digitized with a common timing reference. Arrows indicate connections, not calculated ray trajectories.</desc>
<defs><marker id="spect-08-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#78dfb0" stroke-width="1.5"/></marker><marker id="spect-08-reference" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#efbe71" stroke-width="1.5"/></marker><marker id="spect-08-signal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#a6b9db" stroke-width="1.5"/></marker><pattern id="spect-08-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#34465a"/></pattern></defs>
<rect width="960" height="440" fill="#101e2b"/><rect width="960" height="440" fill="url(#spect-08-grid)"/>
<g fill="none" stroke-width="2"><path d="M130,85L245,85" stroke="#78dfb0" marker-end="url(#spect-08-light)"><title>sample comb</title></path><path d="M318.67516555855497,106.58664458881728L446.32483444144503,188.41335541118272" stroke="#78dfb0" marker-end="url(#spect-08-light)"><title>transmitted comb</title></path><path d="M128.09129152168293,322.7912527174093L441.90870847831707,222.20874728259068" stroke="#78dfb0" marker-end="url(#spect-08-light)"><title>local oscillator</title></path><path d="M520,210L640,210" stroke="#78dfb0" marker-end="url(#spect-08-light)"><title>heterodyne overlap</title></path><path d="M720,210L835,210" stroke="#a6b9db" stroke-dasharray="6 5" marker-end="url(#spect-08-signal)"><title>RF comb</title></path><path d="M260.3987280522449,303.45990775928834L114.60127194775508,116.54009224071164" stroke="#a6b9db" stroke-dasharray="6 5" marker-end="url(#spect-08-signal)"><title>phase reference</title></path><path d="M245,335L130,335" stroke="#a6b9db" stroke-dasharray="6 5" marker-end="url(#spect-08-signal)"><title>phase reference</title></path></g>
<g transform="translate(90,85)">
<title>100 MHz probe comb: Its spectral teeth interrogate the sample.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><path d="M-13 0H13M0-13V13" stroke="#587088" stroke-width="1.5"/>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">1</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">100 MHz probe comb</tspan></text></g><g transform="translate(90,335)">
<title>100 MHz + 100 Hz LO: The slight repetition-rate offset maps optical teeth to RF.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><path d="M-13 0H13M0-13V13" stroke="#587088" stroke-width="1.5"/>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">2</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">100 MHz + 100 Hz LO</tspan></text></g><g transform="translate(285,85)">
<title>Gas cell: Changes probe amplitude and phase.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(0.5106382978723404) rotate(0)"><rect x="-45" y="-27.5" width="90" height="55" rx="6" fill="#b8933f" fill-opacity="0.00"/><rect x="-45" y="-27.5" width="90" height="9.350000000000001" rx="6" fill="#d9b968" fill-opacity="0.00"/><path d="M -39 -27.5 L 39 -27.5 A 6 6 0 0 1 45 -21.5 L 45 21.5 A 6 6 0 0 1 39 27.5 L -39 27.5 A 6 6 0 0 1 -45 21.5 L -45 -21.5 A 6 6 0 0 1 -39 -27.5 " fill="none" stroke="#7a5f28" stroke-width="2"/><circle cx="-36.9" cy="-19.8" r="4" fill="#5b4520" stroke="#3d2e15" stroke-width="1"/><circle cx="36.9" cy="-19.8" r="4" fill="#5b4520" stroke="#3d2e15" stroke-width="1"/><circle cx="-36.9" cy="19.8" r="4" fill="#5b4520" stroke="#3d2e15" stroke-width="1"/><circle cx="36.9" cy="19.8" r="4" fill="#5b4520" stroke="#3d2e15" stroke-width="1"/><circle cx="0" cy="-27.5" r="8.8" fill="#fff" stroke="#4d565f" stroke-width="1.5"/><line x1="0" y1="-27.5" x2="3.5200000000000005" y2="-32.34" stroke="#c0392b" stroke-width="1.5" stroke-linecap="round"/><rect x="18.5" y="-37.5" width="8" height="10" fill="#6b7280" stroke="#3f4650" stroke-width="1"/><line x1="22.5" y1="-49.5" x2="22.5" y2="-37.5" stroke="#1361fa" stroke-width="2.2"/><polygon points="22.5,-54.5 18.5,-47.5 26.5,-47.5" fill="#1361fa"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">3</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Gas cell</tspan></text></g><g transform="translate(480,210)">
<title>Comb overlap: Spatial and polarization matching allow heterodyne beating.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(1) rotate(0)"><rect x="-12.7" y="-12.7" width="25.4" height="25.4" fill="#c9e4f5" stroke="#4a90c4" stroke-width="1.5"/><line x1="-12.7" y1="12.7" x2="12.7" y2="-12.7" stroke="#4a90c4" stroke-width="1.5"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">4</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Comb overlap</tspan></text></g><g transform="translate(680,210)">
<title>Fast photodiode: Converts paired optical teeth into RF beats.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(1) rotate(0)"><rect x="-18" y="-13" width="36" height="26" rx="3" fill="#4b5563" stroke="#2b333d" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#fff">PD</text><rect x="-19.5" y="-9" width="3" height="18" fill="#93c5fd" stroke="#2b333d" stroke-width="1"/><circle cx="11" cy="-8" r="3.1" fill="#88919b" opacity="0.45" stroke="#fff" stroke-width="0.8"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">5</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Fast photodiode</tspan></text></g><g transform="translate(875,210)">
<title>RF digitizer: Acquires a time record for coherent spectral recovery.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><path d="M-13 0H13M0-13V13" stroke="#587088" stroke-width="1.5"/>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">6</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">RF digitizer</tspan></text></g><g transform="translate(285,335)">
<title>Common reference: Controls coherence and frequency assignment.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><path d="M-13 0H13M0-13V13" stroke="#587088" stroke-width="1.5"/>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">7</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Common reference</tspan></text></g>
<g font-family="Arial,sans-serif" font-size="12" fill="#b3c5d4"><path d="M30 418H56" stroke="#78dfb0" stroke-width="2"/><text x="64" y="422">Optical path</text><path d="M188 418H214" stroke="#efbe71" stroke-width="2"/><text x="222" y="422">Reference / auxiliary</text><path d="M402 418H428" stroke="#a6b9db" stroke-width="2" stroke-dasharray="5 4"/><text x="436" y="422">Signal / control</text><text x="930" y="422" text-anchor="end">Arrangement map · not to scale</text></g>
</svg>
