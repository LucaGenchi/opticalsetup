<title>Two-lens cavity mode matching — OpticalSetup setup</title><desc>A real two-lens 1064 nm injection train changes a collimated 6 mm beam into a converging bundle. The receiving camera inspects the chosen waist plane before a prospective cavity input. Native 2D geometrical rays are computed. Diffraction, target-image irradiance and real-lens aberrations are not calculated; ideal object-image markers are separate paraxial constructions. This is the adjustable injection-optics subsystem; no cavity eigenmode or Gaussian overlap efficiency is inferred from a ray waist.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="-42" y="138" width="384.75" height="140" fill="#ffffff"/><polygon points="92.00,197.00 180.00,197.00 180.00,197.25 92.00,197.25" fill="#8b1a1a" opacity="0.28"/><polygon points="180.00,197.00 250.00,199.10 250.00,199.18 180.00,197.25" fill="#8b1a1a" opacity="0.28"/><polygon points="250.00,199.10 268.75,200.00 268.75,200.00 250.00,199.18" fill="#8b1a1a" opacity="0.28"/><polygon points="92.00,197.25 180.00,197.25 180.00,197.50 92.00,197.50" fill="#8b1a1a" opacity="0.28"/><polygon points="180.00,197.25 250.00,199.18 250.00,199.25 180.00,197.50" fill="#8b1a1a" opacity="0.28"/><polygon points="250.00,199.18 268.75,200.00 268.75,200.00 250.00,199.25" fill="#8b1a1a" opacity="0.28"/><polygon points="92.00,197.50 180.00,197.50 180.00,197.75 92.00,197.75" fill="#8b1a1a" opacity="0.28"/><polygon points="180.00,197.50 250.00,199.25 250.00,199.32 180.00,197.75" fill="#8b1a1a" opacity="0.28"/><polygon points="250.00,199.25 268.75,200.00 268.75,200.00 250.00,199.32" fill="#8b1a1a" opacity="0.28"/><polygon points="92.00,197.75 180.00,197.75 180.00,198.00 92.00,198.00" fi