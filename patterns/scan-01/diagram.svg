<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" class="pattern-diagram" role="img" aria-labelledby="scan-01-title scan-01-desc">
<!-- SPDX-FileCopyrightText: 2026 Luca Genchi and contributors
     SPDX-License-Identifier: GPL-3.0-or-later -->
<title id="scan-01-title">Single-axis pupil-conjugate scanner</title><desc id="scan-01-desc">A galvo is relayed at 1× to an objective pupil so steering changes the focused spot position with minimal pupil walk. Arrows indicate connections, not calculated ray trajectories.</desc>
<defs><marker id="scan-01-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#78dfb0" stroke-width="1.5"/></marker><marker id="scan-01-reference" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#efbe71" stroke-width="1.5"/></marker><marker id="scan-01-signal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#a6b9db" stroke-width="1.5"/></marker><pattern id="scan-01-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#34465a"/></pattern></defs>
<rect width="960" height="440" fill="#101e2b"/><rect width="960" height="440" fill="url(#scan-01-grid)"/>
<g fill="none" stroke-width="2"><path d="M130,190L240,190" stroke="#78dfb0" marker-end="url(#scan-01-light)"><title>light path</title></path><path d="M320,190L450,190" stroke="#78dfb0" marker-end="url(#scan-01-light)"><title>light path</title></path><path d="M530,190L660,190" stroke="#78dfb0" marker-end="url(#scan-01-light)"><title>light path</title></path><path d="M740,190L830,190" stroke="#78dfb0" marker-end="url(#scan-01-light)"><title>light path</title></path><path d="M280,230L280,330L700,330L700,230" stroke="#efbe71" marker-end="url(#scan-01-reference)"><title>pupil conjugates</title></path></g>
<g transform="translate(90,190)">
<title>Collimated input: Keep the beam smaller than the galvo clear aperture.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(0.46153846153846156) rotate(0)"><rect x="-46" y="-17" width="92" height="34" rx="4" fill="#3a3f46" stroke="#22252a" stroke-width="1.5"/><text x="0" y="0"  text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" letter-spacing="1.2" fill="#fff">CW LASER</text><rect x="46" y="-4.5" width="5" height="9" fill="#666" stroke="#444" stroke-width="1"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">1</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Collimated input</tspan></text></g><g transform="translate(280,190)">
<title>Galvo pivot: The reflecting pivot is the relayed pupil plane.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(1) rotate(0)"><circle r="4.5" fill="#777" stroke="#444" stroke-width="1.2"/><g transform="rotate(0)"><line x1="0" y1="-10" x2="0" y2="10" stroke="#444" stroke-width="3"/></g><path d="M -9,-13 A 15 15 0 0 1 9,-13" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="3 2"/><path d="M -9,13 A 15 15 0 0 0 9,13" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="3 2"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">2</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Galvo pivot</tspan></text></g><g transform="translate(490,190)">
<title>100/100 mm relay: Two-lens 4f conjugation of the pivot.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(1) rotate(0)"><path d="M 0,-12.7 Q 9,0 0,12.7 Q -9,0 0,-12.7 Z" fill="#c9e4f5" stroke="#4a90c4" stroke-width="1.5"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">3</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">100/100 mm relay</tspan></text></g><g transform="translate(700,190)">
<title>Objective pupil: Relayed galvo plane coincides with entrance pupil.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(1) rotate(0)"><path d="M 16,-5.5 L 7,-12.5 L -21,-12.5 L -21,12.5 L 7,12.5 L 16,5.5 Z" fill="#8d98a5" stroke="none"/><path d="M 7,-12.5 L -21,-12.5 L -21,12.5 L 7,12.5" fill="none" stroke="#4d565f" stroke-width="1.5" stroke-linejoin="round"/><line x1="7" y1="-12.5" x2="7" y2="12.5" stroke="#4d565f" stroke-width="1"/><rect x="-21" y="-12.5" width="2.4" height="8.50" fill="#2f3e4d"/><rect x="-21" y="4.00" width="2.4" height="8.50" fill="#2f3e4d"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">4</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Objective pupil</tspan></text></g><g transform="translate(870,190)">
<title>Scanned focal plane: Objective converts steering angle to spot displacement.</title><rect class="node-outline" x="-35" y="-29" width="70" height="58" rx="5" fill="#f4f7fa" stroke="#a6b9ca" stroke-width="1.5"/><g transform="scale(0.8571428571428571) rotate(0)"><rect x="-25" y="-3.00" width="50" height="6" fill="#c9e4f5" stroke="none"/></g>
<circle cx="-34" cy="-29" r="10" fill="#1c3549" stroke="#819bab"/><text x="-34" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">5</text>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#eef5fb" stroke="#101e2b" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="0" y="48">Scanned focal plane</tspan></text></g>
<g font-family="Arial,sans-serif" font-size="12" fill="#b3c5d4"><path d="M30 418H56" stroke="#78dfb0" stroke-width="2"/><text x="64" y="422">Optical path</text><path d="M188 418H214" stroke="#efbe71" stroke-width="2"/><text x="222" y="422">Reference / auxiliary</text><path d="M402 418H428" stroke="#a6b9db" stroke-width="2" stroke-dasharray="5 4"/><text x="436" y="422">Signal / control</text><text x="930" y="422" text-anchor="end">Arrangement map · not to scale</text></g>
</svg>
