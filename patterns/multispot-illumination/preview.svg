<title>Four-spot microlens illuminator — OpticalSetup setup</title><desc>Four actual 50 mm lenslets form four focal spots in a line on a camera. This is a meridional four-spot illuminator rather than a simulated second transverse row. Four geometric channels and focal positions are traced. A 2×2 spot grid, microlens diffraction and equal-irradiance calibration require a second transverse axis and wave modeling.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="-2" y="134" width="350.5" height="148" fill="#ffffff"/><polygon points="132.00,180.00 200.00,180.00 200.00,181.67 132.00,181.67" fill="#65ff00" opacity="0.28"/><polygon points="200.00,180.00 250.00,185.00 250.00,185.00 200.00,181.67" fill="#65ff00" opacity="0.28"/><polygon points="132.00,181.67 200.00,181.67 200.00,183.33 132.00,183.33" fill="#65ff00" opacity="0.28"/><polygon points="200.00,181.67 250.00,185.00 250.00,185.00 200.00,183.33" fill="#65ff00" opacity="0.28"/><polygon points="132.00,183.33 200.00,183.33 200.00,185.00 132.00,185.00" fill="#65ff00" opacity="0.28"/><polygon points="200.00,183.33 250.00,185.00 250.00,185.00 200.00,185.00" fill="#65ff00" opacity="0.28"/><polygon points="132.00,185.00 200.00,185.00 200.00,186.67 132.00,186.67" fill="#65ff00" opacity="0.28"/><polygon points="200.00,185.00 250.00,185.00 250.00,185.00 200.00,186.67" fill="#65ff00" opacity="0.28"/><polygon points="132.00,186.67 200.00,186.67 200.00,188.33 132.00,188.33" fill="#65ff00" opacity="0.28"/><polygon points="200.00,186.67 250.00,185.00 250.00,185.00 200.00,188.33" fill="#65ff00" opacity="0.28"/><polygon points="132.00,188.33 200.00,188.33 200.00,190.00 132.00,190.00" fill="#65ff00" opacity="0.28"/><polygon points="200.