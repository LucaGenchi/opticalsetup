<title>Native 1064-to-532 nm harmonic generation — OpticalSetup setup</title><desc>A 1064 nm pulse is focused into a native SHG crystal, recollimated and spectrally separated. The 532 nm channel reaches a bandpass and spectrometer; residual pump goes to a dump. The crystal uses a user-set conversion share rather than a focused phase-matching calculation. It does not predict walk-off, depletion dynamics, damage thresholds or a measured conversion efficiency.</desc><defs><linearGradient id="pulseSpectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.22" stop-color="#2563eb"/><stop offset="0.45" stop-color="#10b981"/><stop offset="0.65" stop-color="#eab308"/><stop offset="0.82" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="18" y="148" width="940" height="274" fill="#ffffff"/><polyline points="152.00,200.00 300.00,200.00 400.00,200.00" fill="none" stroke="#8b1a1a" stroke-width="2" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" /><polyline points="400.00,200.00 500.00,200.00 760.00,200.00" fill="none" stroke="#8b1a1a" stroke-width="2" opacity="0.77" stroke-linejoin="round" stroke-linecap="round" /><polyline points="400.00,200.00 500.00,200.00 760.00,200.00" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.53" stroke-linejoin="round" stroke-linecap="round" /><polyline points="760.00,200.00 873.00,200.00" fill="none" stroke="#65ff00" stroke-width="2" opacity="0.53" stroke-linejoin="round" stroke-linecap="round" /><g transform="translate(100 200) rotate(0)"><rect x="-46" y="-17" width="92" height="34" rx="4" fill="#3a3f46" stroke="#22252a" stroke-width="1.5"/><text x="0" y="-3"  text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" letter-spacing="1.5" fill="#fff">LASER</text><g stroke="#8fd3ff" stroke-width="1.2" opacity="0.95"><path d="M -17,8 L -12,8 L -10,3 L -8,11 L -6,8 L -1,8"/><path d="M 3,8 L 8,8 L 10,3 L 12,11 L 14,8 L 19,8"/></g><rect x="46" y="-6" width="5" height="12" fill="#666" stroke="#444" stroke-width="1"/></g><g transform="translate(300 200) rotate(0)"><path d="M 0,-15 Q 9,0 0,15 Q -9,0 0,-15 Z" fill="#c9e4f5" stroke="#4a90c4" stroke-width="1.5"/></g><g transform="translate(400 200) rotate(0)"><path d="M -12,-11 L 16,-11 L 12,11 L -16,11 Z" fill="#e4d5f2" stroke="#8a5fb0" stroke-width="1.5"/></g><g transform="translate(500 200) rotate(0)"><path d="M 0,-15 Q 9,0 0,15 Q -9,0 0,-15 Z" fill="#c9e4f5" stroke="#4a90c4" stroke-width="1.5"/></g><g transform="translate(650 200) rotate(90)"><rect x="-3" y="-12.7" width="6" height="25.4" fill="#dfeef7" stroke="#5d7f96" stroke-width="1.5"/><line x1="-3" y1="-12.7" x2="-3" y2="12.7" stroke="#b04ad0" stroke-width="2"/></g><g transform="translate(760 200) rotate(0)"><rect x="-2.5" y="-12.7" width="5" height="25.4" fill="#bfe3c9" stroke="#557" stroke-width="1.5"/></g><g transform="translate(900 200) rotate(0)"><rect x="-27" y="-20" width="54" height="40" rx="4" fill="#44505d" stroke="#202a33" stroke-width="1.5"/><rect x="-28.7" y="-16" width="3.4" height="32" rx="1" fill="#fde68a" stroke="#26323c" stroke-width="0.8"/><text x="1" y="1"  text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="720" letter-spacing="0.4" fill="#fff">SPEC</text><circle cx="19" cy="-13" r="3" fill="#65ff00" opacity="1" stroke="#fff" stroke-width="0.8"/></g><g transform="translate(650 380) rotate(90)"><path d="M -10,-20 L 10,-20 L 10,20 L -10,20 Z M -10,-20 L 4,0 L -10,20" fill="#26292e" stroke="#111" stroke-width="1.5"/></g></svg>
