name: Publish approved community setups

on:
  push:
    branches: [main]
    paths:
      - community-submissions/*.json

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-community
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Include every approved merge
        run: |
          git fetch origin main
          git switch -C main origin/main

      - name: Build community pages and manifest
        run: node tools/build-community.mjs

      - name: Update the combined sitemap
        run: node tools/build-sitemap.mjs

      - name: Run repository checks
        run: npm test

      # main requires a reviewed pull request, with no bypass for this
      # workflow's identity -- deliberately so: publishing never gets a
      # direct-push shortcut, no matter what a future workflow might do.
      # Instead this opens a small PR containing only the files
      # tools/build-community.mjs and tools/build-sitemap.mjs
      # deterministically produce; merging it (see
      # docs/community-setup-review.md) is the actual publish step.
      - name: Open a PR with the generated publishing files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- community sketch/js/community-data.js sitemap.xml; then
            echo "Community publishing files are already current."
            exit 0
          fi
          branch="publish-community/$(date -u +%Y%m%d%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add community sketch/js/community-data.js sitemap.xml
          git diff --cached --check
          git commit -m "Publish approved community setups"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Publish approved community setups" \
            --body "Regenerates \`community/\`, \`sketch/js/community-data.js\`, and \`sitemap.xml\` from the community-submissions/*.json files currently on \`main\`, via \`node tools/build-community.mjs\` and \`node tools/build-sitemap.mjs\`. The diff is entirely deterministic generated output -- nothing here should need hand-editing. Merging this PR is what makes the setup(s) live; see docs/community-setup-review.md."
